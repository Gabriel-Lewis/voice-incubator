# Climate (Dutch), as the English library's climate.yaml: the home's
# thermostat (Settings), or one a command is given (its implied target) --
# what it's set to and how warm it is inside, setting it, its mode
# (verwarmen, koelen, uit ...), and its fan. Setting it is a version of Set
# the temperature, whose other sets a thermostat by name, through Home
# Assistant's intent.
#
# Modes are the hvac_modes list's and fan modes the fan_modes list's, said in
# Dutch, Home Assistant's words for them as the values; what is said back
# says them in Dutch again. Temperatures are said with a decimal comma.
title: Climate
icon: mdi:thermostat

# Commands shown together in Add a command: each one's topic.
topics:
  thermostat: {title: Thermostat, icon: mdi:thermostat}

# What the commands share (merged into them with <<, or as a whole).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  needs: &needs
    - Set the home's thermostat in Settings, or give it one of its own
      (its implied target).
  # Warmer or cooler by slots.step degrees Celsius -- 1.8 times as many,
  # rounded, on a thermostat in Fahrenheit (its highest above 50) -- within
  # its limits: the temperature it keeps, or in heat and cool mode both ends.
  # Off, or keeping none, it says so.
  temperature_step: &temperature_step
    - variables:
        thermostat: "{{ slots.entity[0] }}"
        by: >-
          {{ ((slots.step | float) * (1.8 if (state_attr(thermostat, 'max_temp') or 0) | float > 50 else 1)) | round(0) }}
        lowest: "{{ state_attr(thermostat, 'min_temp') | float(-1000) }}"
        highest: "{{ state_attr(thermostat, 'max_temp') | float(1000) }}"
        kept: "{{ state_attr(thermostat, 'temperature') }}"
        low: "{{ state_attr(thermostat, 'target_temp_low') }}"
        high: "{{ state_attr(thermostat, 'target_temp_high') }}"
        is_off: {outcome: "off"}
        keeps_none: {outcome: keeps_none}
    - if: "{{ is_state(thermostat, 'off') }}"
      then:
        - stop: The thermostat is off
          response_variable: is_off
    - if: "{{ kept is number }}"
      then:
        - variables:
            changed: {to: "{{ [[kept + by, lowest] | max, highest] | min }}"}
        - action: climate.set_temperature
          target:
            entity_id: "{{ thermostat }}"
          data:
            temperature: "{{ changed.to }}"
        - stop: Changed the temperature
          response_variable: changed
    - if: "{{ low is number and high is number }}"
      then:
        - variables:
            changed: {low: "{{ [low + by, lowest] | max }}", high: "{{ [high + by, highest] | min }}"}
        - action: climate.set_temperature
          target:
            entity_id: "{{ thermostat }}"
          data:
            target_temp_low: "{{ changed.low }}"
            target_temp_high: "{{ changed.high }}"
        - stop: Changed the temperatures
          response_variable: changed
    - stop: The thermostat keeps no temperature
      response_variable: keeps_none
  # What a step says when it changed nothing.
  temperature_said: &temperature_said
    "off": De thermostaat staat uit.
    keeps_none: De thermostaat houdt geen temperatuur aan.

commands:
  # The thermostat (the home's, or one of its own), or a thermostat by name
  # (Home Assistant's intent). Also the heating: "zet de verwarming op 20
  # graden".
  set_temperature:
    title: Set the temperature
    topic: thermostat
    icon: mdi:thermometer
    description: de temperatuur instellen
    supports: temperature
    require: [[zet, temperatuur, graden, graad, verwarming]]
    optional: [[zet, draai], [temperatuur, verwarming, thermostaat], [hoger, lager], [op, naar], [graden, graad]]
    # A question about degrees is not a setting: "waar staat de thermostaat
    # op", "hoeveel is 20 graden in Fahrenheit" (the units skill).
    exclude: [wat, waar, hoeveel, hoe, omrekenen, is, zijn]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Temperatuur ingesteld.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} op
          {{ slots.temperature | string | replace('.', ',') }} graden gezet.
    formerly: [set_thermostat]
    variants:
      here:
        title: Set the thermostat
        description: de thermostaat op een temperatuur zetten
        intent: null
        home: climate
        action:
          - action: climate.set_temperature
            target:
              entity_id: "{{ slots.entity }}"
            data:
              temperature: "{{ slots.temperature }}"
        response:
          done:
            brief: Thermostaat ingesteld.
            specific: Thermostaat op {{ slots.temperature | string | replace('.', ',') }} graden gezet.
        needs: *needs
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).

  thermostat:
    title: Ask the thermostat
    topic: thermostat
    icon: mdi:thermostat
    description: weten waar de thermostaat op staat en hoe warm het binnen is
    examples: ["(waar|wat) staat de thermostaat op", "waar is de thermostaat op ingesteld",
               "wat is de temperatuur (binnen|in huis)", "hoe (warm|koud) is het (binnen|in huis)"]
    require: [[thermostaat, binnen, in huis]]
    optional: [[wat, waar, hoe], [is, staat, het, de, temperatuur, op, ingesteld, warm, koud]]
    exclude: [zet, draai, verander]
    home: climate
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- set modes = {'heat': 'verwarmen', 'cool': 'koelen', 'heat_cool': 'verwarmen en koelen', 'auto': 'automatisch',
        'dry': 'ontvochtigen', 'fan_only': 'alleen ventilator'} -%}
      {%- set inside = state_attr(e, 'current_temperature') -%}
      {%- set to = state_attr(e, 'temperature') -%}
      {%- set low = state_attr(e, 'target_temp_low') -%}
      {%- set high = state_attr(e, 'target_temp_high') -%}
      {%- set mode = states(e) -%}
      {{ "Het is binnen " ~ (inside | round | int) ~ " graden. " if inside is not none else "" }}
      {%- if mode == 'off' -%}De thermostaat staat uit.
      {%- elif to is not none -%}De thermostaat staat op {{ to | round | int }} graden.
      {%- elif low is not none and high is not none -%}De thermostaat houdt het tussen {{ low | round | int }} en {{ high | round | int }} graden.
      {%- else -%}De thermostaat staat op {{ modes.get(mode, mode | replace('_', ' ')) }}.
      {%- endif -%}
    needs: *needs

  heat_up:
    title: Turn up the heat
    topic: thermostat
    icon: mdi:thermometer-chevron-up
    description: de verwarming hoger zetten
    # "Zet de verwarming hoger", "draai de thermostaat omhoog", "verhoog de
    # temperatuur"; to a number, it's Set the thermostat (Set the
    # temperature's version).
    require: [[hoger, omhoog, warmer, verhoog, verhogen], [verwarming, temperatuur, thermostaat]]
    optional: [[zet, draai, maak], [een beetje, wat, iets]]
    exclude: [wat, waar, is, hoe, staat]
    home: climate
    slots: {step: 1}
    action: *temperature_step
    # Not seen at once: what it's set to now, said.
    verbosity: specific
    response:
      <<: *temperature_said
      done:
        brief: Verwarming hoger gezet.
        specific: >-
          {%- macro deg(t) -%}{%- set n = t | default(0, true) | float -%}{{ n | int if n == n | int else n | round(1) | string | replace('.', ',') }}{%- endmacro -%}
          Thermostaat hoger gezet, {{ ('naar ' ~ deg(result.to)) if result.to is defined
          else ('tussen ' ~ deg(result.low) ~ ' en ' ~ deg(result.high)) }} graden.
    needs: *needs

  heat_down:
    title: Turn down the heat
    topic: thermostat
    icon: mdi:thermometer-chevron-down
    description: de verwarming lager zetten
    require: [[lager, omlaag, kouder, koeler, verlaag, verlagen], [verwarming, temperatuur, thermostaat]]
    optional: [[zet, draai, maak], [een beetje, wat, iets]]
    exclude: [wat, waar, is, hoe, staat]
    home: climate
    slots: {step: -1}
    action: *temperature_step
    verbosity: specific
    response:
      <<: *temperature_said
      done:
        brief: Verwarming lager gezet.
        specific: >-
          {%- macro deg(t) -%}{%- set n = t | default(0, true) | float -%}{{ n | int if n == n | int else n | round(1) | string | replace('.', ',') }}{%- endmacro -%}
          Thermostaat lager gezet, {{ ('naar ' ~ deg(result.to)) if result.to is defined
          else ('tussen ' ~ deg(result.low) ~ ' en ' ~ deg(result.high)) }} graden.
    needs: *needs

  thermostat_mode:
    title: Ask the thermostat's mode
    topic: thermostat
    icon: mdi:thermostat
    description: weten in welke modus de thermostaat staat en wat hij doet
    examples: ["in welke (modus|stand) staat de thermostaat", "wat is de modus van de thermostaat", "wat doet de thermostaat",
               "is de thermostaat aan het (verwarmen|koelen)"]
    require: [[thermostaat], [modus, stand, doet, verwarmen, koelen]]
    optional: [[wat, welke, in welke], [is, de, in, op, staat, van, aan het]]
    exclude: [zet, schakel, draai, verander]
    home: climate
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- set modes = {'heat': 'verwarmen', 'cool': 'koelen', 'heat_cool': 'verwarmen en koelen', 'auto': 'automatisch',
        'dry': 'ontvochtigen', 'fan_only': 'alleen ventilator'} -%}
      {%- set doing = {'heating': 'aan het verwarmen', 'cooling': 'aan het koelen', 'drying': 'aan het ontvochtigen',
        'idle': 'in rust', 'fan': 'alleen aan het ventileren', 'preheating': 'aan het opwarmen', 'defrosting': 'aan het ontdooien'} -%}
      {%- set mode = states(e) -%}
      {%- set action = state_attr(e, 'hvac_action') -%}
      {%- if mode == 'off' -%}De thermostaat staat uit.
      {%- else -%}De thermostaat staat op {{ modes.get(mode, mode | replace('_', ' ')) }}.
      {%- if action and action != 'off' %} Hij is nu {{ doing.get(action, action | replace('_', ' ')) }}.{% endif -%}
      {%- endif -%}
    needs: *needs

  set_thermostat_mode:
    title: Set the thermostat's mode
    topic: thermostat
    icon: mdi:thermostat
    description: de thermostaat op verwarmen, koelen, automatisch of uit zetten
    # "Zet de thermostaat op verwarmen", "zet de thermostaat op koelen",
    # "schakel de thermostaat naar automatisch".
    require: [[thermostaat]]
    optional: [[zet, schakel, draai, verander], [modus, stand], [op, naar]]
    exclude: [wat, welke, is, staat, hoe]
    lists:
      mode: {list: hvac_modes}
    home: climate
    supports: {hvac_mode: mode}
    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ slots.entity }}"
        data:
          hvac_mode: "{{ slots.mode }}"
    verbosity: specific
    response:
      done:
        brief: Thermostaat ingesteld.
        specific: >-
          {%- set modes = {'heat': 'verwarmen', 'cool': 'koelen', 'heat_cool': 'verwarmen en koelen', 'auto': 'automatisch',
            'dry': 'ontvochtigen', 'fan_only': 'alleen ventilator'} -%}
          {%- if slots.mode == 'off' -%}Thermostaat uitgezet.
          {%- else -%}Thermostaat op {{ modes.get(slots.mode, slots.mode) }} gezet.
          {%- endif -%}
    needs: *needs

  thermostat_fan:
    title: Ask the thermostat's fan
    topic: thermostat
    icon: mdi:fan
    description: weten op welke stand de ventilator van de thermostaat staat
    examples: ["op welke stand staat de ventilator van de thermostaat", "wat is de ventilatorstand [van de thermostaat]",
               "wat is de ventilatormodus [van de thermostaat]"]
    require: [[ventilatorstand, ventilator stand, ventilatormodus, ventilator modus, ventilator van de thermostaat, thermostaatventilator]]
    optional: [[wat, welke, op welke], [is, de, staat, op, van, stand, thermostaat]]
    exclude: [zet, schakel, draai, verander]
    home: climate
    supports: fan_mode
    # "Aan", "uit", "aan op laag": as it is; "automatisch", "automatisch
    # hoog": on it.
    response: >-
      {%- set words = {'on': 'aan', 'off': 'uit', 'auto': 'automatisch', 'low': 'laag', 'medium': 'middel', 'mid': 'middel',
        'middle': 'middel', 'high': 'hoog', 'circulate': 'circuleren', 'quiet': 'stil', 'diffuse': 'diffuus'} -%}
      {%- set mode = (state_attr(slots.entity[0], 'fan_mode') or '') | lower | replace('_', ' ') -%}
      {%- set parts = mode.split() -%}
      {%- set ns = namespace(rest=[]) -%}
      {%- for p in parts[1:] -%}{%- set ns.rest = ns.rest + [words.get(p, p)] -%}{%- endfor -%}
      {%- set rest = ns.rest | join(' ') -%}
      {%- if not mode -%}De ventilator van de thermostaat is niet ingesteld.
      {%- elif parts[0] in ['on', 'off'] -%}De ventilator van de thermostaat staat {{ words[parts[0]] }}{{ (' op ' ~ rest) if rest }}.
      {%- else -%}De ventilator van de thermostaat staat op {{ ([words.get(parts[0], parts[0])] + ns.rest) | join(' ') }}.
      {%- endif -%}
    needs: *needs

  set_thermostat_fan:
    title: Set the thermostat's fan
    topic: thermostat
    icon: mdi:fan
    description: de ventilatorstand van de thermostaat instellen
    # "Zet de ventilatorstand op automatisch", "zet de ventilator van de
    # thermostaat aan". A ventilator alone is a fan's: "zet de ventilator aan".
    require: [[ventilatorstand, ventilator stand, ventilatormodus, ventilator modus, ventilator van de thermostaat, thermostaatventilator]]
    optional: [[zet, schakel, draai, verander], [stand, modus], [op, naar]]
    exclude: [wat, welke, is, staat, hoe]
    lists:
      mode: {list: fan_modes}
    home: climate
    supports: {fan_mode: mode}
    action:
      - action: climate.set_fan_mode
        target:
          entity_id: "{{ slots.entity }}"
        data:
          fan_mode: "{{ slots.mode }}"
    verbosity: specific
    response:
      done:
        brief: Ventilator van de thermostaat ingesteld.
        specific: >-
          {%- set words = {'on': 'aan', 'off': 'uit', 'auto': 'automatisch', 'low': 'laag', 'medium': 'middel', 'mid': 'middel',
            'middle': 'middel', 'high': 'hoog', 'circulate': 'circuleren', 'quiet': 'stil', 'diffuse': 'diffuus'} -%}
          {%- set parts = (slots.mode | lower | replace('_', ' ')).split() -%}
          {%- set ns = namespace(rest=[]) -%}
          {%- for p in parts[1:] -%}{%- set ns.rest = ns.rest + [words.get(p, p)] -%}{%- endfor -%}
          {%- set rest = ns.rest | join(' ') -%}
          {%- if parts[0] == 'on' -%}Ventilator van de thermostaat aangezet{{ (', op ' ~ rest) if rest }}.
          {%- elif parts[0] == 'off' -%}Ventilator van de thermostaat uitgezet.
          {%- else -%}Ventilator van de thermostaat op {{ ([words.get(parts[0], parts[0])] + ns.rest) | join(' ') }} gezet.
          {%- endif -%}
    needs:
      - Set the home's thermostat in Settings, or give it one of its own
        (its implied target). Its fan modes are matched by their words to the
        fan_modes list's (Names page).
