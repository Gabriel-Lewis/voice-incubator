# Reminders and calendar (Dutch), as the English library's reminders.yaml:
# reminders, and what's on the speaker's calendar.
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: weten wat er vandaag nog in mijn agenda staat
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["wat staat er [vandaag] in mijn agenda", "wat staat er [vandaag] op mijn planning",
               "wat heb ik vandaag [op mijn agenda]"]
    require: [[agenda, planning, kalender]]
    optional: [[wat, wat staat er, staat er], [in, op], [vandaag, voor vandaag]]
    exclude: [zet, voeg, toe]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}Er staat vandaag niets meer in je agenda.
        {% elif events | count == 1 %}Je hebt vandaag {{ events[0] }}.
        {% else %}Je hebt vandaag {{ events[:-1] | join(', ') }} en {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: een herinnering toevoegen
    # With a time, an event on the Voice Incubator calendar that is said on this
    # satellite then: "herinner me om vijf uur 's middags eraan om mama te
    # bellen", "herinner me elke dinsdag om zeven uur 's avonds aan de
    # vuilnisbak", "herinner me over tien minuten aan de oven". Without one,
    # it goes on the to-do list: "herinner me eraan om melk te kopen".
    require: [[herinner me, herinner mij]]
    wildcard:
      slot: reminder
      after: [herinner me, herinner mij]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: een herinnering annuleren
    # On the Voice Incubator calendar, by what it is about, when it is, or both:
    # "annuleer mijn herinnering om mama te bellen", "verwijder de herinnering
    # van morgen", "annuleer de herinnering van vijf uur"; with one, the only
    # one.
    require: [[annuleer, annuleren, verwijder, verwijderen, schrap, vergeet], [herinnering, herinneringen]]
    optional: [[mijn, de]]
    wildcard: {slot: reminder, after: [herinnering, herinneringen], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: weten welke herinneringen er nog komen
    examples: [wat zijn mijn herinneringen, welke herinneringen heb ik, heb ik herinneringen]
    require: [[herinneringen, herinnering]]
    optional: [[wat, welke], [zijn, is], [heb ik, zijn er, staan er], [mijn, nog]]
    exclude: [herinner me, herinner mij, voeg, zet, annuleer, annuleren, verwijder, verwijderen, schrap, vergeet]
    timer: reminder_status
