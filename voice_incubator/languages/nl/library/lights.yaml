# Lights and switches (Dutch), as the English library's lights.yaml: on and
# off, brightness, color, and asking which are on.
title: Lights and switches
icon: mdi:lightbulb-outline

# Commands shown together in Add a command: each one's topic.
topics:
  on_and_off: {title: On and off, icon: mdi:lightbulb-on-outline}
  brightness_and_color: {title: Brightness and color, icon: mdi:brightness-6}

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).
  # 30 percent brighter or dimmer (slots.step), never to off: the lights that
  # are on here, or in an area or floor named, of those added there (Names) --
  # no intent changes brightness by a step -- or a light by name, which
  # comes on to be brightened.
  brightness_step: &brightness_step
    - variables:
        none_on: {outcome: no_lights}
        lights: >-
          {%- if slots.entity -%}
          {{ (slots.entity | select('is_state', 'on') | list) if slots.step | int < 0 else slots.entity }}
          {%- else -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for s in states.light if devices.get(s.entity_id) in place.areas and s.state == 'on'
            and s.attributes.supported_color_modes != ['onoff'] -%}
          {%- set ns.ids = ns.ids + [s.entity_id] -%}
          {%- endfor -%}
          {{ ns.ids }}
          {%- endif -%}
    - if: "{{ not lights }}"
      then:
        - stop: No lights to change
          response_variable: none_on
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >-
                {{ [[((state_attr(repeat.item, 'brightness') or 0) / 2.55) | round(0) + slots.step | int, 1] | max, 100] | min | int }}
  brightness_said: &brightness_said
    no_lights: >-
      {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ' staat uit.') if slots.entity
      else 'Er zijn geen lampen aan ' ~ place.said ~ '.' }}

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    topic: on_and_off
    icon: mdi:lightbulb-on-outline
    description: het licht aandoen
    require: [[licht, lichten, lamp, lampen, verlichting], [aan, aandoen, aanzetten, inschakelen, schakel ... in]]
    optional: [[zet, doe, maak], [alle]]
    exclude: [uit, uitdoen, uitzetten, uitschakelen]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht aan.
        specific: Licht {{ place.said }} aan.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' lampen') if n else 'Licht' }} {{ place.said }} aan.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' en ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} aan.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: een apparaat aanzetten
        require: [[aan, aandoen, aanzetten, inschakelen, schakel ... in]]
        intent: HassTurnOn
        response:
          done:
            brief: Aangezet.
            specific: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} aangezet."
            verbose: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }} aangezet."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    topic: on_and_off
    icon: mdi:lightbulb-off-outline
    description: het licht uitdoen
    require: [[licht, lichten, lamp, lampen, verlichting], [uit, uitdoen, uitzetten, uitschakelen]]
    optional: [[zet, doe, maak, schakel], [alle], [overal]]
    exclude: [aan, aandoen, aanzetten, inschakelen]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht uit.
        specific: Licht {{ place.said }} uit.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' lampen') if n else 'Licht' }} {{ place.said }} uit.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' en ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} uit.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: een apparaat uitzetten
        require: [[uit, uitdoen, uitzetten, uitschakelen]]
        optional: [[zet, doe, maak, schakel]]
        intent: HassTurnOff
        response:
          done:
            brief: Uitgezet.
            specific: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} uitgezet."
            verbose: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }} uitgezet."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    topic: on_and_off
    icon: mdi:lightbulb-question
    description: weten welke lampen aan zijn
    # No example sentences: one said word for word carries no area or floor.
    require: [[is, zijn, brandt, branden, staat, staan], [licht, lichten, lamp, lampen], [aan]]
    optional: [[er], [nog], [ergens]]
    exclude: [zet, doe, schakel, maak]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Nee, de lampen{{ where }} zijn uit.
      {%- elif count > 3 -%}
      Ja, {{ count }} lampen{{ where }} zijn aan.
      {%- else -%}
      Ja, {{ (ns.on[:-1] | join(', ') ~ ' en ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' is' if count == 1 else ' zijn' }} aan.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (set on its page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: weten of een apparaat aan is
        require: [[is, zijn, staat, staan]]
        optional: [[nog]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'aan', 'off': 'uit', 'unavailable': 'niet bereikbaar', 'unknown': 'onbekend'} -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ' is ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Ja' if state == slots.asked else 'Nee' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    topic: brightness_and_color
    icon: mdi:brightness-6
    description: de helderheid instellen
    supports: brightness
    # To a number, also turned on, up or down, or dimmed: "dim het licht naar
    # twintig", "doe het licht in de keuken aan op vijftig procent". Never the
    # volume's, the heating's or the TV's, by a number ("dim het licht met
    # 20"), in kelvin, or in some minutes.
    require: [[helderheid, procent, dim, dimmen, licht, lichten, lamp, lampen, verlichting]]
    optional:
      - [zet, maak, dim, dimmen, verander, draai, doe]
      - [aan, hoger, lager, omhoog, omlaag]
      - [licht, lichten, lamp, lampen, verlichting]
      - [op, naar]
      - [helderheid]
      - [procent]
    exclude: [volume, muziek, tv, televisie, thermostaat, temperatuur, graden, graad, kelvin, met,
              minuut, minuten, uur, uren, seconde, seconden]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Helderheid ingesteld.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} op {{ slots.percentage }} procent gezet.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    topic: brightness_and_color
    icon: mdi:format-color-fill
    description: de kleur van het licht veranderen
    supports: color
    require: [[maak, zet, kleur, verander], [licht, lichten, lamp, lampen]]
    optional: [[op], [kleur]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Kleur veranderd.
        specific: >-
          {%- set kleuren = {'red': 'rood', 'orange': 'oranje', 'yellow': 'geel', 'green': 'groen',
            'blue': 'blauw', 'purple': 'paars', 'pink': 'roze', 'white': 'wit', 'turquoise': 'turquoise', 'magenta': 'magenta'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} is nu {{ kleuren.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[maak, zet, kleur, verander]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  brighter:
    title: Brighter
    topic: brightness_and_color
    icon: mdi:brightness-7
    description: het licht feller maken
    supports: brightness
    require: [[feller, helderder, lichter, hoger, omhoog], [licht, lichten, lamp, lampen, verlichting, helderheid]]
    optional: [[maak, zet, doe, draai], [een beetje, wat, iets]]
    slots: {step: 30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Feller gezet.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} feller gezet.
    variants:
      here:
        title: Brighter in this satellite's area
        examples: ["[maak het] [een beetje|wat] (feller|lichter) [hier]"]
      device:
        <<: *device
        title: Brighten a light by name
        require: [[feller, helderder, lichter, hoger, omhoog]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may brighten (Names page).
      place:
        <<: *place
        title: Brighter in an area or floor

  dimmer:
    title: Dimmer
    topic: brightness_and_color
    icon: mdi:brightness-4
    description: het licht dimmen
    supports: brightness
    require: [[dim, dimmen, donkerder, minder fel, lager, omlaag], [licht, lichten, lamp, lampen, verlichting, helderheid]]
    optional: [[maak, zet, doe, draai], [een beetje, wat, iets]]
    slots: {step: -30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Gedimd.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} gedimd.
    variants:
      here:
        title: Dimmer in this satellite's area
        examples: ["[maak het] [een beetje|wat] (donkerder|minder fel) [hier]"]
      device:
        <<: *device
        title: Dim a light by name
        require: [[dim, dimmen, donkerder, minder fel, lager, omlaag]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Dimmer in an area or floor

  light_temperature:
    title: Set the color temperature
    topic: brightness_and_color
    icon: mdi:white-balance-sunny
    description: de kleurtemperatuur van het licht veranderen
    supports: color_temp
    # By what the white is called: warm wit, zacht wit, neutraal wit, koel
    # wit, daglicht (the color_temperatures list, in kelvin).
    require: [[zet, maak, verander], [licht, lichten, lamp, lampen, verlichting]]
    optional: [[kleurtemperatuur, temperatuur], [op, naar]]
    lists:
      color_temperature: {list: color_temperatures}
    intent:
      name: HassLightSet
      slots: {temperature: "{{ slots.color_temperature }}"}
    verbosity: beep
    response:
      done:
        brief: Kleurtemperatuur veranderd.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} op {{ slots.color_temperature }} kelvin gezet.
    variants:
      here:
        title: Set the color temperature in this satellite's area
      device:
        <<: *device
        title: Set the color temperature of a light by name
        require: [[zet, maak, verander]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color_temperature], [entity, area, color_temperature]]
        needs:
          - Add names for the lights it may change (Names page).
      place:
        <<: *place
        title: Set the color temperature in an area or floor
        combinations: [[area, color_temperature], [floor, color_temperature]]
