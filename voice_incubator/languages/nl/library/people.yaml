# People (Dutch), as the English library's people.yaml: the people who live
# here (People page).
#
# Who is speaking is who the app takes them to be: their voice, else whose
# wake word it was, else the only person -- as "mijn" means (voice_incubator/
# people.py, speaking).
title: People
icon: mdi:account

commands:
  who_am_i:
    title: Who am I
    icon: mdi:account-voice
    description: weten wie er spreekt
    examples: ["wie ben ik", "wie (spreekt|praat) er", "weet je wie ik ben", "hoe heet ik", "wat is mijn naam"]
    response: "{% if speaker.name %}Je bent {{ speaker.name }}.{% else %}Sorry, ik weet niet wie er spreekt.{% endif %}"
