    description: iets op mijn takenlijst zetten
    # The speaker's own (People page); where nobody has one, this one.
    require: [[zet, voeg, schrijf], [mijn takenlijst, mijn to do lijst, mijn todolijst, "m'n takenlijst"]]
    optional: [[op, aan], [toe, erbij]]
    wildcard:
      slot: item
      after: [zet, voeg, schrijf]
      before: [op, aan, toe]
      bounded: true
      max_words: 8
    home: todo_list
    mine: todo_list
    # The whole of it: one the list has already isn't added again
