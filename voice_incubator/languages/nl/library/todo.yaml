# Lists (Dutch), as the English library's todo.yaml: the shopping list and
# the to-do list (de takenlijst) -- adding to them, checking off
# (afstrepen), taking off, and what's on them. "Mijn takenlijst" is the
# speaker's own.
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: iets op de boodschappenlijst zetten
    require: [[zet, voeg, schrijf, doe], [boodschappenlijst, boodschappenlijstje, lijst, lijstje]]
    optional: [[op, aan], [toe, erbij]]
    exclude: [takenlijst, to do lijst, todolijst, to do, todo]
    wildcard:
      slot: item
      after: [zet, voeg, schrijf, doe]
      before: [op, aan, toe]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("appels en bananen": two), unless the list has one
    # called that whole ("macaroni en kaas"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Op de boodschappenlijst gezet.
        specific: "{{ slots.item }} staat op de boodschappenlijst."
        verbose: >-
          {%- if added -%}
          {{ added }} op de boodschappenlijst gezet{{ ' en ' ~ put_back ~ ' er weer op gezet' if put_back }}.
          {%- else -%}
          {{ put_back }} weer op de boodschappenlijst gezet.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: iets van de boodschappenlijst halen
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "test drie" is
    # "test 3"; "appels en bananen" two of them (items), unless one is called
    # that.
    require: [[haal, verwijder, wis], [boodschappenlijst, boodschappenlijstje, lijst, lijstje]]
    optional: [[van, uit], [af, weg]]
    exclude: [takenlijst, to do lijst, todolijst, to do, todo]
    wildcard:
      slot: item
      after: [haal, verwijder, wis]
      before: [van, uit]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Van de boodschappenlijst gehaald.
        specific: "{{ slots.item }} van de boodschappenlijst gehaald."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: iets op de boodschappenlijst afstrepen
    # Done, and kept on the list as such: "streep de melk door op de lijst",
    # "vink eieren af op de boodschappenlijst", "markeer brood als gekocht op
    # de lijst", "streep appels en bananen af op de boodschappenlijst" (each
    # of the items).
    require: [[streep, vink, markeer], [boodschappenlijst, boodschappenlijstje, lijst, lijstje]]
    optional: [[door, af], [op, van], [als gekocht, als gedaan]]
    exclude: [takenlijst, to do lijst, todolijst, to do, todo]
    wildcard:
      slot: item
      after: [streep, vink, markeer]
      before: [door, af, op, van, als gekocht, als gedaan]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Afgestreept.
        specific: "{{ slots.item }} afgestreept op de boodschappenlijst."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: weten wat er op de boodschappenlijst staat
    # What is still to get; what was checked off is left out.
    examples: ["wat staat er op [de|mijn|onze] boodschappenlijst", "wat moeten we [nog] (halen|kopen)",
               "lees [me] de boodschappenlijst voor"]
    require: [[wat staat er op, wat staat op, lees, vertel me], [boodschappenlijst, boodschappenlijstje]]
    optional: [[de, mijn, onze], [voor, me]]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        De boodschappenlijst is leeg.
        {%- elif count == 1 -%}
        Er staat {{ listed[0] }} op de boodschappenlijst.
        {%- elif count > 8 -%}
        Er staan {{ count }} dingen op de boodschappenlijst: {{ listed[:5] | join(', ') }} en nog {{ count - 5 }}.
        {%- else -%}
        Op de boodschappenlijst: {{ listed[:-1] | join(', ') }} en {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

