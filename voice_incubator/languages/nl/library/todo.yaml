        specific: "{{ slots.item }} staat op je takenlijst."
        verbose: "{{ (added ~ ' op je takenlijst gezet') if added else (put_back ~ ' weer op je takenlijst gezet') }}."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it adds to the home's (Settings).

  todo_remove_mine:
