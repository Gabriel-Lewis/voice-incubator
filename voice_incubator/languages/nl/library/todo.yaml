            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Op de takenlijst gezet.
        specific: "{{ slots.item }} staat op de takenlijst."
        verbose: "{{ (added ~ ' op de takenlijst gezet') if added else (put_back ~ ' weer op de takenlijst gezet') }}."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_remove:
    title: Take off the to-do list
