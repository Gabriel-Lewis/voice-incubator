# People (Italian), as the English library's people.yaml: the people who live
# here (People page).
#
# Who is speaking is who the app takes them to be: their voice, else whose
# wake word it was, else the only person -- as "mio" means (voice_incubator/
# people.py, speaking).
title: People
icon: mdi:account

commands:
  who_am_i:
    title: Who am I
    icon: mdi:account-voice
    description: dire chi sta parlando
    examples: ["chi sono [io]", "chi (sta parlando|parla)", "sai chi sono", "come mi chiamo"]
    response: "{% if speaker.name %}Sei {{ speaker.name }}.{% else %}Scusa, non so chi sta parlando.{% endif %}"
