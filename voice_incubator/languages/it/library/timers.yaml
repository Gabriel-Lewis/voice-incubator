# Timers (Italian), as the English library's timers.yaml: on the satellite
# that set them, with the Voice Incubator integration in Home Assistant. A timer is
# picked out by:
#   timer_name  a running timer's name: "annulla il timer pizza"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "un timer chiamato pasta", "un timer per la pasta"
#   duration    "il timer di 5 minuti"
# or it is the only one running. What they say is the language's (its speech
# module's timer sentences).
#
# Timers are the satellite's own, so they have no versions (variants) for a
# device or a place named. Alarms and reminders with a time are events on the
# Voice Incubator calendar in Home Assistant, which the app makes, and ring the
# satellite that set them (the pack's calendar module reads when they are).
title: Timers and alarms
icon: mdi:timer-outline

# Commands shown together in Add a command: each one's topic.
topics:
  timers: {title: Timers, icon: mdi:timer-outline}
  alarms: {title: Alarms, icon: mdi:alarm}

commands:
  start_timer:
    title: Start a timer
    topic: timers
    icon: mdi:timer-plus-outline
    description: impostare un timer
    # "Imposta un timer di 5 minuti", "metti un timer per la pasta di 10 minuti".
    require: [[timer, contaminuti]]
    optional: [[imposta, metti, avvia, fai partire, crea, punta], [di, da, per], [chiamato, per il, per la, per i, per le]]
    wildcard: {slot: timer, after: [timer, chiamato, per il, per la, per i, per le], max_words: 3}
    # Quarters too: "un quarto d'ora", "tre quarti d'ora".
    number: {preset: duration, min: 0.25, step: 0.25}
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    topic: alarms
    icon: mdi:alarm
    description: impostare una sveglia
    # On the Voice Incubator calendar in Home Assistant: "metti la sveglia
    # alle sette e mezza", "svegliami alle 6 di mattina", "una sveglia per le
    # sei e mezza di domani mattina", "una sveglia ogni giorno feriale alle
    # 6 e 45", "la sveglia domani alle 8", "svegliami tra 20 minuti". Without
    # di mattina or di sera it is the next time that comes round; on another
    # day, the morning.
    require: [[sveglia, svegliami, svegliaci]]
    optional: [[metti, imposta, punta, crea], [alle, all', per le, per l', per, tra, fra]]
    wildcard: {slot: time, after: [sveglia, svegliami, svegliaci, alle, all', per le, per l', per, tra, fra], to_end: true,
               max_words: 10}
    exclude: [annulla, anulla, cancella, elimina, togli, spegni, disattiva, quali, quale, quando, che ora, che ore]
    timer: alarm
    verbosity: specific
    response:
      missing_time: Per che ora devo mettere la sveglia?

  cancel_alarm:
    title: Cancel an alarm
    topic: alarms
    icon: mdi:alarm-off
    description: annullare una sveglia
    # "Annulla la mia sveglia", "cancella la sveglia delle 7", "spegni la
    # sveglia di domani". Said over a ringing alarm without a time, it only
    # stops it.
    require: [[annulla, anulla, a nulla, cancella, elimina, togli, spegni, disattiva], [sveglia, sveglie]]
    optional: [[delle, dell', per, alle, di]]
    wildcard: {slot: time, after: [sveglia, delle, dell', per, alle, di], max_words: 6}
    combinations: [[], [time]]
    timer: cancel_alarm
    verbosity: specific

  alarm_status:
    title: Say the alarms
    topic: alarms
    icon: mdi:alarm-check
    description: dire quali sveglie sono impostate
    examples: ["che sveglie ho", "quali sveglie ho", "a che ora è la sveglia", "quando suona la [mia] sveglia",
               "ho (delle|qualche) sveglie", "ci sono sveglie"]
    require: [[sveglia, sveglie]]
    optional: [[che, quali, quale, quando, a che ora], [è, sono, suona], [ho, ci sono, abbiamo], [impostata, impostate, messa, messe]]
    exclude: [annulla, anulla, cancella, elimina, togli, spegni, disattiva, metti, imposta, svegliami, per, alle, tra, fra]
    timer: alarm_status

  cancel_timer:
    title: Cancel a timer
    topic: timers
    icon: mdi:timer-off-outline
    description: annullare un timer
    # Not "togli": "togli 2 minuti al timer" takes time off. "Anulla", "a
    # nulla": annulla as a speech-to-text often writes it.
    require: [[annulla, anulla, a nulla, annullare, cancella, cancellare, ferma, fermare, elimina, spegni], [timer, contaminuti]]
    optional: [[minuti, minuto, secondi, secondo, ore, ora], [chiamato], [di]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    topic: timers
    icon: mdi:timer-cancel-outline
    description: annullare tutti i timer
    require: [[annulla, annullare, cancella, cancellare, ferma, togli, elimina], [tutti], [timer]]
    timer: cancel_all
    verbosity: specific
    # More than one running: asked first.
    confirm: "{{ timers | count > 1 }}"
    response:
      confirm: "Annullare tutti i {{ timers | count }} timer?"

  pause_timer:
    title: Pause a timer
    topic: timers
    icon: mdi:timer-pause-outline
    description: mettere in pausa un timer
    require: [[pausa, sospendi], [timer, contaminuti]]
    optional: [[minuti, minuto, secondi, secondo, ore, ora], [chiamato], [di]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    topic: timers
    icon: mdi:timer-play-outline
    description: riprendere un timer
    require: [[riprendi, riprendere, fai ripartire, riavvia, continua], [timer, contaminuti]]
    optional: [[minuti, minuto, secondi, secondo, ore, ora], [chiamato], [di]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    topic: timers
    icon: mdi:timer-sand
    description: sapere quanto tempo manca
    examples: ["quanto tempo manca", "quanto manca al timer"]
    require: [[quanto], [manca, mancano, rimane, resta]]
    optional: [[tempo], [al, sul], [timer, contaminuti], [minuti, minuto, secondi, secondo, ore, ora], [chiamato], [di]]
    # A time of day: "quanto manca alle 17" (a question).
    exclude: [alle, all'una, fino, mezzogiorno, mezzanotte]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    topic: timers
    icon: mdi:clock-plus-outline
    description: aggiungere tempo a un timer
    # "Aggiungi 5 minuti al timer pizza", "allunga il timer di 2 minuti".
    require: [[aggiungi, allunga, prolunga], [timer, contaminuti]]
    optional: [[al, di], [chiamato]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    # Quarters too: "un quarto d'ora".
    number: {preset: duration, min: 0.25, step: 0.25}
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    topic: timers
    icon: mdi:clock-minus-outline
    description: togliere tempo a un timer
    # "Togli 2 minuti al timer", "accorcia il timer pizza di 2 minuti".
    require: [[togli, accorcia, riduci, leva], [timer, contaminuti]]
    optional: [[al, dal, di], [chiamato]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [timer, chiamato], max_words: 3}
    # Quarters too: "un quarto d'ora".
    number: {preset: duration, min: 0.25, step: 0.25}
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
