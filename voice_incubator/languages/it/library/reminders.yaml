# Reminders and calendar (Italian), as the English library's reminders.yaml:
# reminders, and what's on the speaker's calendar.
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: dire cosa c'è oggi nel mio calendario
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one. ("Mio" is a filler: "calendario" says it.)
    examples: ["cosa c'è nel mio calendario [oggi]", "cosa ho in agenda [oggi]", "che impegni ho oggi", "cosa ho oggi"]
    require: [[calendario, agenda, impegni]]
    optional: [[cosa, che, cos'è], [c'è, ho, abbiamo], [oggi, per oggi]]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}Non hai niente in calendario per il resto della giornata.
        {% elif events | count == 1 %}Oggi hai {{ events[0] }}.
        {% else %}Oggi hai {{ events[:-1] | join(', ') }} e {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: aggiungere un promemoria
    # With a time, an event on the Voice Incubator calendar that is said on this
    # satellite then: "ricordami alle 17 di chiamare la mamma", "ricordami di
    # portare fuori la spazzatura ogni martedì alle 19", "ricordami tra 10
    # minuti di controllare il forno". Without one, it goes on the to-do list.
    require: [[ricordami, ricordatemi]]
    wildcard:
      slot: reminder
      after: [ricordami, ricordatemi]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: annullare un promemoria
    # On the Voice Incubator calendar, by what it is about, when it is, or both:
    # "annulla il promemoria di chiamare la mamma", "cancella il promemoria di
    # domani", "annulla il promemoria delle 17"; with one, the only one.
    require: [[annulla, anulla, a nulla, cancella, elimina, togli, dimentica], [promemoria]]
    wildcard: {slot: reminder, after: [promemoria], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: dire quali promemoria ci sono
    examples: ["quali promemoria ho", "che promemoria ho", "ho (dei|qualche) promemoria", "ci sono promemoria"]
    require: [[promemoria]]
    optional: [[quali, che, quale], [ho, ci sono, abbiamo], [sono, è]]
    exclude: [ricordami, ricordatemi, aggiungi, metti, imposta, annulla, anulla, cancella, elimina, togli, dimentica]
    timer: reminder_status
