# Lights and switches (Polish), as the English library's lights.yaml: on and
# off, brightness, color, and asking which are on.
#
# What acts on devices runs Home Assistant's intents (intent:): on a device by
# name, or on those added to the area on the Names page (devices), each by
# name -- and the unavailable said.
title: Lights and switches
icon: mdi:lightbulb-outline

# Commands shown together in Add a command: each one's topic.
topics:
  on_and_off: {title: On and off, icon: mdi:lightbulb-on-outline}
  brightness_and_color: {title: Brightness and color, icon: mdi:brightness-6}

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).
  # 30 percent brighter or dimmer (slots.step), never to off: the lights that
  # are on here, or in an area or floor named, of those added there (Names) --
  # no intent changes brightness by a step -- or a light by name, which
  # comes on to be brightened.
  brightness_step: &brightness_step
    - variables:
        none_on: {outcome: no_lights}
        lights: >-
          {%- if slots.entity -%}
          {{ (slots.entity | select('is_state', 'on') | list) if slots.step | int < 0 else slots.entity }}
          {%- else -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for s in states.light if devices.get(s.entity_id) in place.areas and s.state == 'on'
            and s.attributes.supported_color_modes != ['onoff'] -%}
          {%- set ns.ids = ns.ids + [s.entity_id] -%}
          {%- endfor -%}
          {{ ns.ids }}
          {%- endif -%}
    - if: "{{ not lights }}"
      then:
        - stop: No lights to change
          response_variable: none_on
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >-
                {{ [[((state_attr(repeat.item, 'brightness') or 0) / 2.55) | round(0) + slots.step | int, 1] | max, 100] | min | int }}
  brightness_said: &brightness_said
    no_lights: >-
      {%- if slots.entity -%}
      {%- set name = names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) or slots.entity[0] -%}
      {%- set w = (name | lower).split(' ')[0] -%}
      {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
        else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
      {{ name }} {{ 'są' if g == 'p' else 'jest' }} wyłączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
      {%- else -%}
      Żadne światło nie jest włączone {{ place.said }}.
      {%- endif -%}

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    topic: on_and_off
    icon: mdi:lightbulb-on-outline
    description: włączyć światło
    # "zapał": zapal as a speech-to-text often writes it.
    require: [[światło, światła, świateł, lampę, lampy, lampki, oświetlenie], [włącz, włączyć, zapal, zapał, zapalić, zaświeć, zaświecić]]
    optional: [[wszystkie, całe]]
    exclude: [wyłącz, wyłączyć, zgaś, zgasić, kolor, koloru, jasność]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Włączono światło.
        specific: Włączono światło {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- set word = 'światło' if n == 1 else ('światła' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'świateł') -%}
          {%- if n == 0 or n > 4 -%}
          Włączono {{ (n ~ ' ' ~ word) if n else 'światło' }} {{ place.said }}.
          {%- else -%}
          Włączono: {{ (ns.names[:-1] | join(', ') ~ ' i ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: włączyć urządzenie
        require: [[włącz, włączyć, zapal, zapalić, uruchom, uruchomić]]
        intent: HassTurnOn
        response:
          done:
            brief: Włączono.
            specific: >-
              {%- set name = names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
            verbose: >-
              {%- set name = names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} {{ place.said }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    topic: on_and_off
    icon: mdi:lightbulb-off-outline
    description: wyłączyć światło
    require: [[światło, światła, świateł, lampę, lampy, lampki, oświetlenie], [wyłącz, wyłączyć, zgaś, zgasić]]
    optional: [[wszystkie, całe], [w całym domu, wszędzie]]
    exclude: [włącz, włączyć, zapal, zapał, zapalić]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Wyłączono światło.
        specific: Wyłączono światło {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- set word = 'światło' if n == 1 else ('światła' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'świateł') -%}
          {%- if n == 0 or n > 4 -%}
          Wyłączono {{ (n ~ ' ' ~ word) if n else 'światło' }} {{ place.said }}.
          {%- else -%}
          Wyłączono: {{ (ns.names[:-1] | join(', ') ~ ' i ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: wyłączyć urządzenie
        require: [[wyłącz, wyłączyć, zgaś, zgasić]]
        optional: null
        intent: HassTurnOff
        response:
          done:
            brief: Wyłączono.
            specific: >-
              {%- set name = names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} wyłączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
            verbose: >-
              {%- set name = names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} {{ place.said }} wyłączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    topic: on_and_off
    icon: mdi:lightbulb-question
    description: sprawdzić, które światła są włączone
    # No example sentences: one said word for word carries no area or floor.
    require: [[czy, które, jakie], [światło, światła, lampa, lampy, lampki],
              [włączone, włączony, włączona, zapalone, zapalona, pali się, palą się, świeci się, świecą się]]
    optional: [[jest, są, jakieś, któreś, nadal, wciąż, jeszcze]]
    exclude: [włącz, wyłącz, zgaś, zapal]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Nie, światła{{ where }} są wyłączone.
      {%- elif count > 3 -%}
      Tak,{{ where }} {{ ('są ' ~ count ~ ' włączone światła') if count % 10 in [2, 3, 4] and count % 100 not in [12, 13, 14]
        else ('jest ' ~ count ~ ' włączonych świateł') }}.
      {%- elif count > 1 -%}
      Tak, {{ ns.on[:-1] | join(', ') ~ ' i ' ~ ns.on[-1] }} są włączone.
      {%- else -%}
      {%- set w = (ns.on[0] | lower).split(' ')[0] -%}
      {%- set g = 'p' if w in ['światła', 'lampki', 'lampy'] or w[-1:] in ['y', 'i'] else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else 'm')) -%}
      Tak, {{ ns.on[0] }} {{ 'są' if g == 'p' else 'jest' }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (set on its page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: sprawdzić, czy urządzenie jest włączone
        require: [[czy, jest, są]]
        optional: [[jest, są, nadal, wciąż, jeszcze]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set name = names.get(e, state_attr(e, 'friendly_name')) or e -%}
          {%- set w = (name | lower).split(' ')[0] -%}
          {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
            else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
          {%- set end = {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'włączon' ~ end, 'off': 'wyłączon' ~ end, 'unavailable': 'niedostępn' ~ end} -%}
          {%- set said = name ~ (' są ' if g == 'p' else ' jest ') ~ words[state] ~ '.' if state in words else name ~ ': stan nieznany.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Tak' if state == slots.asked else 'Nie' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    topic: brightness_and_color
    icon: mdi:brightness-6
    description: ustawić jasność światła
    supports: brightness
    require: [[jasność, jasności, procent]]
    optional: [[ustaw, zmień, ściemnij, rozjaśnij, przyciemnij, zmniejsz, zwiększ, daj], [światło, światła, lampę, lampy, oświetlenie],
               [jasność, jasności], [procent]]
    # A question: "ile to jest 15 procent z 80"; the volume: "ustaw głośność na 30 procent".
    # Never the covers' ("ustaw rolety na 50 procent"), by a number ("o 20
    # procent"), or in some minutes.
    exclude: [ile, jaki, jaka, jakie, oblicz, policz, wynosi, jest, głośność, głośności, muzykę, muzyki, rolety, roletę,
              żaluzje, żaluzję, zasłony, zasłonę, markizę, markizy, osłony, osłonę, bramę, okno, okna, o, minut, minuty,
              minutę, sekund, sekundy, godzin, godziny, godzinę, kelwinów]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Ustawiono jasność.
        specific: >-
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': jasność ' ~ slots.percentage ~ ' procent.') if slots.entity
          else ('Ustawiono jasność ' ~ place.said ~ ' na ' ~ slots.percentage ~ ' procent.') }}
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    topic: brightness_and_color
    icon: mdi:format-color-fill
    description: zmienić kolor światła
    supports: color
    # "Ustaw światło na niebiesko", "zmień kolor lampy na czerwony".
    require: [[ustaw, zmień, zrób, kolor, koloru, przełącz, daj], [światło, światła, lampę, lampy, lampki, oświetlenie]]
    optional: [[kolor, koloru], [na]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Zmieniono kolor.
        specific: >-
          {%- set kolory = {'red': 'czerwony', 'orange': 'pomarańczowy', 'yellow': 'żółty', 'green': 'zielony',
            'blue': 'niebieski', 'purple': 'fioletowy', 'pink': 'różowy', 'white': 'biały', 'turquoise': 'turkusowy', 'magenta': 'purpurowy'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Światło ' ~ place.said }} ma teraz kolor {{ kolory.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[ustaw, zmień, zrób, kolor, koloru, przełącz, daj]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  brighter:
    title: Brighter
    topic: brightness_and_color
    icon: mdi:brightness-7
    description: rozjaśnić światło
    supports: brightness
    require: [[jaśniej, rozjaśnij, rozjaśnić, podkręć, podkręcić, zwiększ, zwiększyć, podnieś, podnieść],
              [światło, światła, lampę, lampy, lampki, oświetlenie, jasność, jasności]]
    optional: [[zrób], [trochę, troszkę, nieco, bardziej]]
    # To a number, it's Set the brightness.
    exclude: [procent, ile, jaka, jaki, głośność, muzykę, temperaturę, ogrzewanie, ciemniej]
    slots: {step: 30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Rozjaśniono.
        specific: >-
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': jaśniej.') if slots.entity
          else ('Rozjaśniono światło ' ~ place.said ~ '.') }}
    variants:
      here:
        title: Brighter in this satellite's area
        examples: ["[zrób] [trochę] jaśniej", "rozjaśnij [trochę]"]
      device:
        <<: *device
        title: Brighten a light by name
        require: [[jaśniej, rozjaśnij, rozjaśnić, podkręć, podkręcić]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may brighten (Names page).
      place:
        <<: *place
        title: Brighter in an area or floor

  dimmer:
    title: Dimmer
    topic: brightness_and_color
    icon: mdi:brightness-4
    description: przyciemnić światło
    supports: brightness
    require: [[ciemniej, ściemnij, ściemnić, przyciemnij, przyciemnić, przygaś, przygasić, zmniejsz, zmniejszyć, obniż, obniżyć],
              [światło, światła, lampę, lampy, lampki, oświetlenie, jasność, jasności]]
    optional: [[zrób], [trochę, troszkę, nieco, bardziej]]
    exclude: [procent, ile, jaka, jaki, głośność, muzykę, temperaturę, ogrzewanie, jaśniej]
    slots: {step: -30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Przyciemniono.
        specific: >-
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': ciemniej.') if slots.entity
          else ('Przyciemniono światło ' ~ place.said ~ '.') }}
    variants:
      here:
        title: Dimmer in this satellite's area
        examples: ["[zrób] [trochę] ciemniej", "przyciemnij [trochę]", "ściemnij [trochę]"]
      device:
        <<: *device
        title: Dim a light by name
        require: [[ciemniej, ściemnij, ściemnić, przyciemnij, przyciemnić, przygaś, przygasić]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Dimmer in an area or floor

  light_temperature:
    title: Set the color temperature
    topic: brightness_and_color
    icon: mdi:white-balance-sunny
    description: zmienić barwę światła
    supports: color_temp
    # By what the white is called: ciepła, miękka, neutralna, chłodna biel,
    # dzienne (the color_temperatures list, in kelvin): "ustaw ciepłe
    # światło", "zmień światło w kuchni na chłodną biel".
    require: [[ustaw, zmień, zrób, przełącz, daj], [światło, światła, lampę, lampy, lampki, oświetlenie]]
    optional: [[barwę, barwa, barwy, temperaturę barwową, temperatura barwowa], [na]]
    lists:
      color_temperature: {list: color_temperatures}
    intent:
      name: HassLightSet
      slots: {temperature: "{{ slots.color_temperature }}"}
    verbosity: beep
    response:
      done:
        brief: Zmieniono barwę światła.
        specific: >-
          {%- set k = slots.color_temperature | string -%}
          {%- if slots.entity -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}: {{ {'2700': 'ciepła biel', '3000': 'miękka biel',
            '4000': 'neutralna biel', '5000': 'chłodna biel', '6500': 'światło dzienne'}.get(k, k ~ ' kelwinów') }}.
          {%- else -%}
          Ustawiono {{ {'2700': 'ciepłą biel', '3000': 'miękką biel', '4000': 'neutralną biel', '5000': 'chłodną biel',
            '6500': 'światło dzienne'}.get(k, k ~ ' kelwinów') }} {{ place.said }}.
          {%- endif -%}
    variants:
