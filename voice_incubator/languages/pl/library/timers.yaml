# Timers (Polish), as the English library's timers.yaml: on the satellite
# that set them. They need the Voice Incubator integration in Home
# Assistant, which gives each satellite a voice_timer_list; the app starts,
# matches and rings them. A timer is picked out by:
#   timer_name  a running timer's name: "anuluj minutnik pizza"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "minutnik o nazwie pizza", "minutnik pizza",
#               "minutnik do pizzy"
#   duration    "minutnik na 5 minut"
# or it is the only one running. A timer is a "minutnik", or a "timer" (said
# "tajmer"); an alarm a "budzik".
#
# Timers are the satellite's own, so they have no versions (variants) for a
# device or a place named. Alarms and reminders with a time are events on the
# Voice Incubator calendar in Home Assistant, which the app makes, and ring the
# satellite that set them: when one is for is read from all that follows
# "budzik" or "obudź mnie" (the language's calendar.py).
title: Timers and alarms
icon: mdi:timer-outline

# Commands shown together in Add a command: each one's topic.
topics:
  timers: {title: Timers, icon: mdi:timer-outline}
  alarms: {title: Alarms, icon: mdi:alarm}

commands:
  start_timer:
    title: Start a timer
    topic: timers
    icon: mdi:timer-plus-outline
    description: ustawić minutnik
    # "Ustaw minutnik na 5 minut", "minutnik na pół godziny", "nastaw minutnik
    # pizza na dziesięć minut", "minutnik o nazwie pizza na kwadrans".
    require: [[minutnik, timer, tajmer, odliczanie]]
    optional: [[ustaw, nastaw, włącz, uruchom, odpal, zacznij, ustawić, nastawić, włączyć], [na],
               [o nazwie, nazwany, dla, do]]
    exclude: [anuluj, usuń, zatrzymaj, wyłącz, wstrzymaj, wznów, ile, zostało, dodaj, odejmij, skróć, przedłuż, wszystkie]
    wildcard: {slot: timer, after: [minutnik, timer, tajmer, o nazwie, nazwany, dla, do], max_words: 3}
    # Quarters too ("kwadrans", "trzy kwadranse"), and halves and quarters as
    # likely as whole numbers: "minutnik na pół godziny" is not one named
    # "pół".
    number:
      preset: duration
      min: 0.25
      step: 0.25
      prior:
        - {when: [sekundy, sekund, sekunda, sekundę], multiple_of: 5, cost: 0}
        - {when: [sekundy, sekund, sekunda, sekundę], cost: 2.5}
        - {multiple_of: 0.25, cost: 0}
        - {cost: 1.0}
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    topic: alarms
    icon: mdi:alarm
    description: ustawić budzik
    # On the Voice Incubator calendar in Home Assistant: "ustaw budzik na
    # siódmą", "obudź mnie jutro o szóstej", "budzik na wpół do ósmej jutro
    # rano", "budzik w dni robocze na szóstą czterdzieści pięć", "budzik za 20
    # minut". Without "rano" or "wieczorem" it is the next time that comes
    # round; on another day, the morning.
    require: [[budzik, budzika, alarm, obudź mnie, obudź nas, obudź]]
    optional: [[ustaw, nastaw, włącz, ustawić, nastawić]]
    wildcard: {slot: time, after: [budzik, budzika, alarm, obudź mnie, obudź nas, obudź], to_end: true, max_words: 9}
    exclude: [jaki, jakie, jakiej, kiedy, który, którą, której, ile, czy, anuluj, usuń, skasuj, wyłącz, odwołaj, zatrzymaj,
              wstrzymaj]
    timer: alarm
    verbosity: specific
    response:
      missing_time: Na którą godzinę ustawić budzik?

  cancel_alarm:
    title: Cancel an alarm
    topic: alarms
    icon: mdi:alarm-off
    description: anulować budzik
    # "Anuluj budzik", "usuń budzik na siódmą", "wyłącz budzik na jutro",
    # "anuluj jutrzejszy budzik". Said over a ringing alarm without a time, it
    # only stops it.
    require: [[anuluj, anulować, usuń, usunąć, skasuj, wyłącz, wyłączyć, odwołaj], [budzik, budzika, budziki, alarm, alarmu]]
    optional: [[mój, ten], [na, o]]
    wildcard: {slot: time, before: [budzik, budzika], after: [na, o], max_words: 6}
    combinations: [[], [time]]
    timer: cancel_alarm
    verbosity: specific

  alarm_status:
    title: Say the alarms
    topic: alarms
    icon: mdi:alarm-check
    description: powiedzieć, jakie budziki są ustawione
    examples: ["jakie mam budziki", "na którą mam budzik", "czy mam [ustawiony] budzik", "czy mam jakieś budziki",
               "kiedy zadzwoni budzik"]
    require: [[budzik, budziki, budzika, budzików, alarm, alarmy]]
    optional: [[jakie, jaki, kiedy, którą, czy, ile], [mam, są, jest], [ustawiony, ustawione, ustawionych, jakieś], [dzwoni, zadzwoni]]
    exclude: [anuluj, usuń, skasuj, wyłącz, odwołaj, ustaw, nastaw, obudź]
    timer: alarm_status

  cancel_timer:
    title: Cancel a timer
    topic: timers
    icon: mdi:timer-off-outline
    description: anulować minutnik
    examples: ["(anuluj|wyłącz|zatrzymaj|usuń) minutnik", "(anuluj|wyłącz|usuń) timer"]
    require: [[anuluj, anulować, wyłącz, wyłączyć, zatrzymaj, zatrzymać, usuń, usunąć, skasuj],
              [minutnik, minutnika, timer, timera, tajmer, odliczanie]]
    optional: [[minut, minuty, minutę, sekund, sekundy, godzin, godziny, godzinę], [o nazwie, nazwany, na, dla, do]]
    # Not a new one: "ustaw minutnik na pizzę".
    exclude: [ustaw, nastaw, wszystkie, wszystkich]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutnik, minutnika, timer, o nazwie, nazwany, dla, do]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    topic: timers
    icon: mdi:timer-cancel-outline
    description: anulować wszystkie minutniki
    require: [[anuluj, anulować, wyłącz, zatrzymaj, usuń, skasuj], [wszystkie, wszystkich], [minutniki, minutników, timery, timerów, minutnik]]
    timer: cancel_all
    verbosity: specific
    # More than one running: asked first (no count: its noun's form follows it).
    confirm: "{{ timers | count > 1 }}"
    response:
      confirm: "Anulować wszystkie minutniki?"

  pause_timer:
    title: Pause a timer
    topic: timers
    icon: mdi:timer-pause-outline
    description: wstrzymać minutnik
    require: [[wstrzymaj, wstrzymać, zapauzuj, spauzuj, pauza], [minutnik, minutnika, minutniki, timer, timera, odliczanie]]
    optional: [[minut, minuty, minutę, sekund, sekundy, godzin, godziny, godzinę], [o nazwie, nazwany, na, dla, do]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutnik, minutnika, timer, o nazwie, nazwany, dla, do]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    topic: timers
    icon: mdi:timer-play-outline
    description: wznowić minutnik
    require: [[wznów, wznowić, kontynuuj, odpauzuj, uruchom ponownie], [minutnik, minutnika, minutniki, timer, timera, odliczanie]]
    optional: [[minut, minuty, minutę, sekund, sekundy, godzin, godziny, godzinę], [o nazwie, nazwany, na, dla, do]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutnik, minutnika, timer, o nazwie, nazwany, dla, do]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    topic: timers
    icon: mdi:timer-sand
    description: sprawdzić, ile czasu zostało
    examples: ["ile [jeszcze] [czasu] zostało", "ile [czasu] zostało na minutniku", "ile zostało do końca"]
    require: [[ile], [zostało, pozostało, brakuje]]
    optional: [[czasu, jeszcze], [na, do, w], [minutniku, minutnika, minutnik, timerze, timera, końca], [o nazwie, nazwany]]
    # A date: "ile dni zostało do świąt"; a time of day: "ile zostało do
    # siedemnastej" (a question).
    exclude: [dni, dzień, tygodni, tygodnie, tygodnia, miesięcy, miesiące, lat, roku, pierwszej, drugiej, trzeciej,
              czwartej, piątej, szóstej, siódmej, ósmej, dziewiątej, dziesiątej, jedenastej, dwunastej, trzynastej,
              czternastej, piętnastej, szesnastej, siedemnastej, osiemnastej, dziewiętnastej, dwudziestej, północy,
              południa, wpół, budzik, budzika, budziku]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutniku, minutnika, minutnik, o nazwie, nazwany]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    topic: timers
    icon: mdi:clock-plus-outline
    description: dodać czas do minutnika
    # "Dodaj 5 minut do minutnika pizza", "przedłuż minutnik o 2 minuty".
    require: [[dodaj, dołóż, przedłuż, wydłuż, dorzuć], [minutnik, minutnika, minutnikowi, timer, timera]]
    optional: [[do, o], [o nazwie, nazwany]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutnika, minutnik, timera, o nazwie, nazwany]}
    # Quarters too: "kwadrans".
    number: {preset: duration, min: 0.25, step: 0.25}
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    topic: timers
    icon: mdi:clock-minus-outline
    description: odjąć czas z minutnika
    # "Odejmij 2 minuty od minutnika", "skróć minutnik pizza o 2 minuty".
    require: [[odejmij, skróć, zmniejsz, zabierz, ujmij], [minutnik, minutnika, minutnikowi, timer, timera]]
    optional: [[od, z, o], [o nazwie, nazwany]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [minutnika, minutnik, timera, o nazwie, nazwany]}
    # Quarters too: "kwadrans".
    number: {preset: duration, min: 0.25, step: 0.25}
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
