# Reminders and calendar (Polish), as the English library's reminders.yaml:
# reminders, and what's on the speaker's calendar.
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: powiedzieć, co mam dzisiaj w kalendarzu
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["co mam [dzisiaj|dziś] w kalendarzu", "co mam [dzisiaj|dziś] w planach", "co mam dzisiaj", "co mam dziś",
               "jakie mam plany na dziś"]
    require: [[kalendarzu, kalendarz, kalendarza, planach, plany, grafiku, harmonogramie]]
    optional: [[co, jakie], [mam, jest], [dzisiaj, dziś]]
    exclude: [dodaj, przypomnij, ustaw, usuń, anuluj, budzik, jutro]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}Do końca dnia nie masz nic w kalendarzu.
        {% elif events | count == 1 %}Dzisiaj masz: {{ events[0] }}.
        {% else %}Dzisiaj masz: {{ events[:-1] | join(', ') }} i {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: dodać przypomnienie
    # With a time, an event on the Voice Incubator calendar that is said on
    # this satellite then: "przypomnij mi o siedemnastej, żebym zadzwonił do
    # mamy", "przypomnij mi w każdy wtorek o dziewiętnastej wynieść śmieci",
    # "przypomnij mi za dziesięć minut sprawdzić piekarnik". Without one, it
    # goes on the to-do list. All of what follows is the reminder's, its
    # time among it ("żebym", "o", "że" too): the calendar reads it.
    require: [[przypomnij mi, przypomnij nam, przypomnij]]
    wildcard:
      slot: reminder
      after: [przypomnij mi, przypomnij nam, przypomnij]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: anulować przypomnienie
    # On the Voice Incubator calendar, by what it is about, when it is, or
    # both: "anuluj przypomnienie o mamie", "usuń przypomnienie na jutro",
    # "anuluj przypomnienie o siedemnastej"; with one, the only one.
    require: [[anuluj, anulować, usuń, usunąć, skasuj, odwołaj], [przypomnienie, przypomnienia, przypomnień, przypomnieniu]]
    optional: [[moje, to]]
    wildcard: {slot: reminder, after: [przypomnienie, przypomnienia, przypomnień, przypomnieniu], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: powiedzieć, jakie przypomnienia są zaplanowane
    examples: ["jakie mam przypomnienia", "czy mam jakieś przypomnienia", "jakie są moje przypomnienia"]
    require: [[przypomnienia, przypomnienie, przypomnień]]
    optional: [[jakie, czy, ile], [mam, są], [jakieś, moje]]
    exclude: [przypomnij, dodaj, ustaw, anuluj, usuń, skasuj, odwołaj]
    timer: reminder_status
