# Lists (Polish), as the English library's todo.yaml: the shopping list
# ("lista zakupów") and the to-do list ("lista zadań", "lista rzeczy do
# zrobienia"): adding to them, checking off ("skreśl", "odhacz"), taking off
# ("usuń"), and what's on them. An item is said back as it was heard, in the
# case its sentence took ("dodaj kawę": "Dodano kawę").
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: dodać coś do listy zakupów
    require: [[dodaj, dopisz, wpisz, zapisz, dodać, dopisać],
              [listy zakupów, listę zakupów, lista zakupów, zakupów, listy, listę]]
    optional: [[do, na]]
    exclude: [zadań, do zrobienia]
    wildcard:
      slot: item
      after: [dodaj, dopisz, wpisz, zapisz, dodać, dopisać]
      before: [do, na]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("jabłka i banany": two), unless the list has one
    # called that whole ("chleb i masło"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Dodano do listy zakupów.
        specific: "Dodano {{ slots.item }} do listy zakupów."
        verbose: >-
          {%- if added -%}
          Dodano {{ added }} do listy zakupów{{ ' i przywrócono na nią ' ~ put_back if put_back }}.
          {%- else -%}
          Przywrócono {{ put_back }} na listę zakupów.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: usunąć coś z listy zakupów
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "test trzy" is
    # "test 3"; "jabłka i banany" two of them (items), unless one is called
    # that.
    require: [[usuń, wyrzuć, skasuj, usunąć, wyrzucić], [listy zakupów, zakupów, listy]]
    optional: [[z, ze]]
    exclude: [zadań, do zrobienia]
    wildcard:
      slot: item
      after: [usuń, wyrzuć, skasuj, usunąć, wyrzucić]
      before: [z, ze]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Usunięto z listy zakupów.
        specific: "Usunięto {{ slots.item }} z listy zakupów."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: skreślić coś na liście zakupów jako kupione
    # Done, and kept on the list as such: "skreśl mleko z listy zakupów",
    # "odhacz jajka na liście zakupów", "zaznacz chleb jako kupiony na
    # liście", "skreśl jabłka i banany z listy zakupów" (each of the items).
    require: [[skreśl, wykreśl, odhacz, odznacz, zaznacz, oznacz, skreślić, wykreślić, odhaczyć],
              [listy zakupów, listę zakupów, lista zakupów, liście zakupów, zakupów, listy, listę, liście]]
    optional: [[z, ze, na], [jako kupione, jako kupiony, jako kupiona, jako zrobione]]
    exclude: [zadań, do zrobienia]
    wildcard:
      slot: item
      after: [skreśl, wykreśl, odhacz, odznacz, zaznacz, oznacz, skreślić, wykreślić, odhaczyć]
      before: [z, ze, na, jako kupione, jako kupiony, jako kupiona, jako zrobione]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Skreślono z listy zakupów.
        specific: "Skreślono {{ slots.item }} z listy zakupów."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: powiedzieć, co jest na liście zakupów
    # What is still to get; what was checked off is left out.
    examples: ["co (jest|mam|mamy) na liście zakupów", "co trzeba kupić", "przeczytaj [mi] listę zakupów"]
    require: [[co, przeczytaj, odczytaj, powiedz], [liście zakupów, listę zakupów, lista zakupów, listy zakupów]]
    optional: [[jest, mam, mamy, znajduje się], [mi]]
    exclude: [dodaj, dopisz, usuń, skreśl, wykreśl, odhacz, zaznacz, zadań, do zrobienia]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- set rest = count - 5 -%}
        {%- set things = 'pozycje' if count % 10 in [2, 3, 4] and count % 100 not in [12, 13, 14] else 'pozycji' -%}
        {%- set others = 'inne' if rest % 10 in [2, 3, 4] and rest % 100 not in [12, 13, 14] else 'innych' -%}
        {%- if count == 0 -%}
        Lista zakupów jest pusta.
        {%- elif count == 1 -%}
        Na liście zakupów jest {{ listed[0] }}.
        {%- elif count > 8 -%}
        Na liście zakupów jest {{ count }} {{ things }}:
        {{ listed[:5] | join(', ') }} i jeszcze {{ rest }} {{ others }}.
        {%- else -%}
        Na liście zakupów: {{ listed[:-1] | join(', ') }} i {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

