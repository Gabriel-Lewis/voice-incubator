    examples: ["co (jest|mamy) na liście zadań", "przeczytaj [mi] listę zadań", "co mamy do zrobienia"]
    require: [[co, przeczytaj, odczytaj, powiedz], [liście zadań, listę zadań, lista zadań, listy zadań, do zrobienia]]
    optional: [[jest, mamy, znajduje się], [mi]]
    exclude: [mojej, moją, moja, moich, dodaj, dopisz, usuń, skreśl, wykreśl, odhacz, zaznacz, zakupów]
