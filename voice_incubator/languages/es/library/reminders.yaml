# Reminders and calendar (Spanish), as the English library's reminders.yaml:
# reminders, and what's on the speaker's calendar.
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: decir qué tengo hoy en mi calendario
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["qué (tengo|hay) [hoy] en mi (calendario|agenda)", "qué tengo hoy"]
    require: [[mi calendario, mi agenda]]
    optional: [[qué, qué hay, qué tengo], [hoy, para hoy]]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}No tienes nada más en el calendario para hoy.
        {% elif events | count == 1 %}Hoy tienes {{ events[0] }}.
        {% else %}Hoy tienes {{ events[:-1] | join(', ') }} y {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: añadir un recordatorio
    # With a time, an event on the Voice Incubator calendar that is said on this
    # satellite then: "recuérdame a las cinco de la tarde llamar a mamá",
    # "recuérdame sacar la basura todos los martes a las siete de la tarde",
    # "recuérdame dentro de diez minutos que mire el horno". Without one, it
    # goes on the to-do list ("recuérdame comprar pan").
    require: [[recuérdame, recuérdeme, recuérdanos]]
    wildcard:
      slot: reminder
      after: [recuérdame, recuérdeme, recuérdanos]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: cancelar un recordatorio
    # On the Voice Incubator calendar, by what it is about, when it is, or both:
    # "cancela mi recordatorio de llamar a mamá", "borra el recordatorio de
    # mañana", "cancela el recordatorio de las cinco"; with one, the only one.
    require: [[cancela, cancelar, borra, elimina, quita, olvida], [recordatorio, recordatorios]]
    optional: [[mi, el]]
    wildcard: {slot: reminder, after: [recordatorio, recordatorios], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: decir qué recordatorios hay
    examples: ["cuáles son mis recordatorios", "qué recordatorios tengo", "tengo (algún recordatorio|recordatorios)"]
    require: [[recordatorios, recordatorio]]
    optional: [[qué, cuáles, cuál], [son, es], [tengo, hay], [mis, mi, algún]]
    exclude: [recuérdame, añade, pon, cancela, cancelar, borra, elimina, quita, olvida]
    timer: reminder_status
