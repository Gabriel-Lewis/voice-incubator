    verbosity: specific
    response:
      done:
        brief: Añadido a la lista de tareas.
        specific: "He añadido {{ slots.item }} a la lista de tareas."
        verbose: "{{ ('He añadido ' ~ added ~ ' a') if added else ('He vuelto a poner ' ~ put_back ~ ' en') }} la lista de tareas."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

