# Lists (Spanish), as the English library's todo.yaml: the shopping list
# ("la lista de la compra") and the to-do list ("la lista de tareas"):
# adding to them, checking off ("tacha", "marca"), taking off ("quita",
# "borra"), and what's on them.
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: añadir algo a la lista de la compra
    require: [[añade, agrega, pon, apunta, mete], [lista de la compra, lista de compras, lista]]
    optional: [[a, en]]
    exclude: [tareas, pendientes]
    wildcard:
      slot: item
      after: [añade, agrega, pon, apunta, mete]
      before: [a, en]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("naranjas y plátanos": two), unless the list has one
    # called that whole ("pan y aceite"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Añadido a la lista de la compra.
        specific: "He añadido {{ slots.item }} a la lista de la compra."
        verbose: >-
          {%- if added -%}
          He añadido {{ added }} a la lista de la compra{{ ' y he vuelto a poner ' ~ put_back if put_back }}.
          {%- else -%}
          He vuelto a poner {{ put_back }} en la lista de la compra.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: quitar algo de la lista de la compra
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "prueba tres" is
    # "prueba 3"; "manzanas y plátanos" two of them (items), unless one is
    # called that.
    require: [[quita, borra, elimina, saca], [lista de la compra, lista de compras, lista]]
    optional: [[de, del]]
    exclude: [tareas, pendientes]
    wildcard:
      slot: item
      after: [quita, borra, elimina, saca]
      before: [de, del]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: "{{ 'Quitado de la lista de la compra.' if items | count < 2 else 'Quitados de la lista de la compra.' }}"
        specific: "He quitado {{ slots.item }} de la lista de la compra."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: tachar algo de la lista de la compra como comprado
    # Done, and kept on the list as such: "tacha la leche de la lista", "marca
    # los huevos como comprados en la lista de la compra", "tacha manzanas y
    # plátanos de la lista de la compra" (each of the items).
    require: [[tacha, tachar, marca, marcar], [lista de la compra, lista de compras, lista]]
    optional: [[de, del, en], [como comprado, como comprada, como comprados, como compradas, como hecho]]
    exclude: [tareas, pendientes]
    wildcard:
      slot: item
      after: [tacha, tachar, marca, marcar]
      before: [de, del, en, como comprado, como comprada, como comprados, como compradas, como hecho]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: "{{ 'Tachado.' if items | count < 2 else 'Tachados.' }}"
        specific: "He tachado {{ slots.item }} de la lista de la compra."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: decir qué hay en la lista de la compra
    # What is still to get; what was checked off is left out.
    examples: ["qué hay en [la|mi|nuestra] lista de la compra", "qué (tengo|tenemos) que comprar",
               "(lee|léeme|dime) la lista de la compra"]
    require: [[qué hay, qué tengo, qué tenemos, lee, léeme, dime], [lista de la compra, lista de compras]]
    optional: [[nuestra]]
    exclude: [tareas, pendientes]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        La lista de la compra está vacía.
        {%- elif count == 1 -%}
        En la lista de la compra hay {{ listed[0] }}.
        {%- elif count > 8 -%}
        Hay {{ count }} cosas en la lista de la compra: {{ listed[:5] | join(', ') }} y {{ count - 5 }} más.
        {%- else -%}
        En la lista de la compra: {{ listed[:-1] | join(', ') }} y {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

