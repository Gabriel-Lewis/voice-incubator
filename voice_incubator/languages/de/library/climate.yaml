# Climate (German), as the English library's climate.yaml: the home's
# thermostat (Settings), or one a command is given (its implied target) --
# what it's set to and how warm it is inside, setting it, its mode (Heizen,
# Kühlen, aus ...), and its fan. Setting it is a version of Set the
# temperature, whose other sets a thermostat by name, through Home
# Assistant's intent.
title: Climate
icon: mdi:thermostat

# Commands shown together in Add a command: each one's topic.
topics:
  thermostat: {title: Thermostat, icon: mdi:thermostat}

# What the commands share (merged into them with <<, or as a whole).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  needs: &needs
    - Set the home's thermostat in Settings, or give it one of its own
      (its implied target).
  # Warmer or cooler by slots.step degrees Celsius -- 1.8 times as many,
  # rounded, on a thermostat in Fahrenheit (its highest above 50) -- within
  # its limits: the temperature it keeps, or in heat and cool mode both ends.
  # Off, or keeping none, it says so.
  temperature_step: &temperature_step
    - variables:
        thermostat: "{{ slots.entity[0] }}"
        by: >-
          {{ ((slots.step | float) * (1.8 if (state_attr(thermostat, 'max_temp') or 0) | float > 50 else 1)) | round(0) }}
        lowest: "{{ state_attr(thermostat, 'min_temp') | float(-1000) }}"
        highest: "{{ state_attr(thermostat, 'max_temp') | float(1000) }}"
        kept: "{{ state_attr(thermostat, 'temperature') }}"
        low: "{{ state_attr(thermostat, 'target_temp_low') }}"
        high: "{{ state_attr(thermostat, 'target_temp_high') }}"
        is_off: {outcome: "off"}
        keeps_none: {outcome: keeps_none}
    - if: "{{ is_state(thermostat, 'off') }}"
      then:
        - stop: The thermostat is off
          response_variable: is_off
    - if: "{{ kept is number }}"
      then:
        - variables:
            changed: {to: "{{ [[kept + by, lowest] | max, highest] | min }}"}
        - action: climate.set_temperature
          target:
            entity_id: "{{ thermostat }}"
          data:
            temperature: "{{ changed.to }}"
        - stop: Changed the temperature
          response_variable: changed
    - if: "{{ low is number and high is number }}"
      then:
        - variables:
            changed: {low: "{{ [low + by, lowest] | max }}", high: "{{ [high + by, highest] | min }}"}
        - action: climate.set_temperature
          target:
            entity_id: "{{ thermostat }}"
          data:
            target_temp_low: "{{ changed.low }}"
            target_temp_high: "{{ changed.high }}"
        - stop: Changed the temperatures
          response_variable: changed
    - stop: The thermostat keeps no temperature
      response_variable: keeps_none
  # What a step says when it changed nothing.
  temperature_said: &temperature_said
    "off": Das Thermostat ist aus.
    keeps_none: Das Thermostat hält gerade keine Temperatur.

commands:
  # The thermostat (the home's, or one of its own), or a thermostat by name
  # (Home Assistant's intent). Also the heating: "dreh die Heizung auf 22
  # hoch", "stell die Heizung auf 20".
  set_temperature:
    title: Set the temperature
    topic: thermostat
    icon: mdi:thermometer
    description: die Temperatur einstellen
    supports: temperature
    require: [[stelle, stell, setze, setz, temperatur, grad, heizung, thermostat]]
    optional: [[stelle, stell, setze, setz, dreh, drehe], [temperatur, heizung, thermostat], [hoch, runter, rauf], [auf], [grad]]
    # A question is not a setting: "worauf ist das Thermostat eingestellt",
    # "wie viel sind 20 Grad in Fahrenheit" (the units skill).
    exclude: [was, wie, wieviel, worauf, umrechnen, sind, ist]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Temperatur eingestellt.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Temperatur ' ~ place.said }} auf {{ slots.temperature | string | replace('.', ',') }} Grad gestellt.
    formerly: [set_thermostat]
    variants:
      here:
        title: Set the thermostat
        description: das Thermostat auf eine Temperatur stellen
        intent: null
        home: climate
        action:
          - action: climate.set_temperature
            target:
              entity_id: "{{ slots.entity }}"
            data:
              temperature: "{{ slots.temperature }}"
        response:
          done:
            brief: Thermostat eingestellt.
            specific: Thermostat auf {{ slots.temperature | string | replace('.', ',') }} Grad gestellt.
        needs: *needs
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).

  thermostat:
    title: Ask the thermostat
    topic: thermostat
    icon: mdi:thermostat
    description: sagen, worauf das Thermostat steht und wie warm es drinnen ist
    examples: ["worauf (steht|ist) das thermostat [eingestellt|gestellt]", "was zeigt das thermostat",
               "wie (warm|kalt) ist es (drinnen|im haus)", "wie ist die temperatur (drinnen|im haus)"]
    require: [[thermostat, drinnen, im haus]]
    optional: [[was, wie, worauf], [ist, steht, es, temperatur, eingestellt, gestellt, auf, warm, kalt, zeigt]]
    home: climate
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- set inside = state_attr(e, 'current_temperature') -%}
      {%- set to = state_attr(e, 'temperature') -%}
      {%- set low = state_attr(e, 'target_temp_low') -%}
      {%- set high = state_attr(e, 'target_temp_high') -%}
      {%- set mode = states(e) -%}
      {%- set modes = {'heat': 'Heizen', 'cool': 'Kühlen', 'heat_cool': 'Heizen und Kühlen', 'auto': 'Automatik',
        'dry': 'Entfeuchten', 'fan_only': 'nur Lüfter'} -%}
      {{ "Drinnen sind es " ~ (inside | round | int) ~ " Grad. " if inside is not none else "" }}
      {%- if mode == 'off' -%}Das Thermostat ist aus.
      {%- elif to is not none -%}Das Thermostat steht auf {{ to | round | int }} Grad.
      {%- elif low is not none and high is not none -%}Das Thermostat hält es zwischen {{ low | round | int }} und {{ high | round | int }} Grad.
      {%- else -%}Das Thermostat steht auf {{ modes.get(mode, mode | replace('_', ' ')) }}.
      {%- endif -%}
    needs: *needs

  heat_up:
    title: Turn up the heat
    topic: thermostat
    icon: mdi:thermometer-chevron-up
    description: die Heizung höher drehen
    # "Dreh die Heizung hoch", "erhöhe die Temperatur"; to a number, it's Set
    # the thermostat (Set the temperature's version).
    require: [[hoch, höher, rauf, wärmer, aufdrehen, hochdrehen, erhöhe, erhöhen, dreh ... auf, drehe ... auf],
              [heizung, temperatur, thermostat]]
    optional: [[dreh, drehe, mach, mache, stell, stelle], [ein bisschen, ein wenig, etwas]]
    exclude: [was, wie, ist]
    home: climate
    slots: {step: 1}
    action: *temperature_step
    # Not seen at once: what it's set to now, said.
    verbosity: specific
    response:
      <<: *temperature_said
      done:
        brief: Heizung höher gedreht.
        specific: >-
          {%- macro deg(t) -%}{%- set n = t | default(0, true) | float -%}{{ (n | int if n == n | int else n | round(1)) | string | replace('.', ',') }}{%- endmacro -%}
          {%- if result.to is defined -%}Thermostat auf {{ deg(result.to) }} Grad hochgedreht.
          {%- else -%}Thermostat hochgedreht, jetzt zwischen {{ deg(result.low) }} und {{ deg(result.high) }} Grad.
          {%- endif -%}
    needs: *needs

  heat_down:
    title: Turn down the heat
    topic: thermostat
    icon: mdi:thermometer-chevron-down
    description: die Heizung niedriger drehen
    require: [[runter, herunter, niedriger, kälter, runterdrehen, herunterdrehen, senke, senken, verringere, verringern],
              [heizung, temperatur, thermostat]]
    optional: [[dreh, drehe, mach, mache, stell, stelle], [ein bisschen, ein wenig, etwas]]
    exclude: [was, wie, ist]
    home: climate
    slots: {step: -1}
    action: *temperature_step
    verbosity: specific
    response:
      <<: *temperature_said
      done:
        brief: Heizung niedriger gedreht.
        specific: >-
          {%- macro deg(t) -%}{%- set n = t | default(0, true) | float -%}{{ (n | int if n == n | int else n | round(1)) | string | replace('.', ',') }}{%- endmacro -%}
          {%- if result.to is defined -%}Thermostat auf {{ deg(result.to) }} Grad runtergedreht.
          {%- else -%}Thermostat runtergedreht, jetzt zwischen {{ deg(result.low) }} und {{ deg(result.high) }} Grad.
          {%- endif -%}
    needs: *needs

  thermostat_mode:
    title: Ask the thermostat's mode
    topic: thermostat
    icon: mdi:thermostat
    description: sagen, in welchem Modus das Thermostat ist und was es gerade tut
    examples: ["in welchem modus ist das thermostat", "welchen modus hat das thermostat", "was macht das thermostat [gerade]",
               "(heizt|kühlt|läuft) das thermostat [gerade]"]
    require: [[thermostat], [modus, macht, tut, heizt, kühlt, läuft]]
    optional: [[was, welchem, welchen, welcher], [ist, hat, gerade, eingestellt]]
    home: climate
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- set modes = {'heat': 'Heizen', 'cool': 'Kühlen', 'heat_cool': 'Heizen und Kühlen', 'auto': 'Automatik',
        'dry': 'Entfeuchten', 'fan_only': 'nur Lüfter'} -%}
      {%- set doing = {'heating': 'Es heizt gerade.', 'cooling': 'Es kühlt gerade.', 'drying': 'Es entfeuchtet gerade.',
        'idle': 'Es ist gerade im Leerlauf.', 'fan': 'Gerade läuft der Lüfter.', 'preheating': 'Es heizt gerade vor.',
        'defrosting': 'Es taut gerade ab.'} -%}
      {%- set mode = states(e) -%}
      {%- set action = state_attr(e, 'hvac_action') -%}
      {%- if mode == 'off' -%}Das Thermostat ist aus.
      {%- else -%}Das Thermostat steht auf {{ modes.get(mode, mode | replace('_', ' ')) }}.
      {%- if action and action != 'off' %} {{ doing.get(action, 'Es ist gerade ' ~ (action | replace('_', ' ')) ~ '.') }}{% endif -%}
      {%- endif -%}
    needs: *needs

  set_thermostat_mode:
    title: Set the thermostat's mode
    topic: thermostat
    icon: mdi:thermostat
    description: das Thermostat auf Heizen, Kühlen, Automatik oder aus stellen
    # "Stell das Thermostat auf Heizen", "schalte das Thermostat aus", "stell
    # das Thermostat auf Klima".
    require: [[thermostat]]
    optional: [[stelle, stell, setze, setz, schalte, schalt, mach, mache, wechsle, wechsel], [modus], [auf]]
    exclude: [was, wie, ist, welchem, welchen]
    lists:
      mode: {list: hvac_modes}
    home: climate
    supports: {hvac_mode: mode}
    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ slots.entity }}"
        data:
          hvac_mode: "{{ slots.mode }}"
    verbosity: specific
    response:
      done:
        brief: Thermostat eingestellt.
        specific: >-
          {%- set modes = {'heat': 'Heizen', 'cool': 'Kühlen', 'heat_cool': 'Heizen und Kühlen', 'auto': 'Automatik',
            'dry': 'Entfeuchten', 'fan_only': 'nur Lüfter'} -%}
          {%- if slots.mode == 'off' -%}Thermostat ausgeschaltet.
          {%- else -%}Thermostat auf {{ modes.get(slots.mode, slots.mode) }} gestellt.
          {%- endif -%}
    needs: *needs

  thermostat_fan:
    title: Ask the thermostat's fan
    topic: thermostat
    icon: mdi:fan
    description: sagen, worauf der Lüfter des Thermostats steht
    examples: ["(was|wie) ist der lüftermodus", "worauf steht der lüfter des thermostats",
               "wie ist der (thermostatlüfter|lüfter des thermostats) eingestellt"]
    require: [[lüftermodus, lüfterstufe, thermostatlüfter, lüfter des thermostats]]
    optional: [[was, wie, worauf, welcher, welche], [ist, steht, eingestellt, gestellt, auf]]
    home: climate
    supports: fan_mode
    # "An", "aus", "an niedrig": as it is; "Automatik", "auto hoch": on it.
    response: >-
      {%- set mode = (state_attr(slots.entity[0], 'fan_mode') or '') | lower | replace('_', ' ') -%}
      {%- set words = {'auto': 'Automatik', 'on': 'an', 'off': 'aus', 'low': 'niedrig', 'medium': 'mittel',
        'middle': 'mittel', 'high': 'hoch', 'circulate': 'Umluft', 'diffuse': 'diffus', 'focus': 'fokussiert'} -%}
      {%- set ns = namespace(said=[]) -%}
      {%- for w in mode.split() -%}{%- set ns.said = ns.said + [words.get(w, w)] -%}{%- endfor -%}
      {%- if not mode -%}Der Lüfter des Thermostats ist nicht eingestellt.
      {%- elif mode.split()[0] in ['on', 'off'] -%}Der Lüfter des Thermostats ist {{ ns.said | join(' ') }}.
      {%- else -%}Der Lüfter des Thermostats steht auf {{ ns.said | join(' ') }}.
      {%- endif -%}
    needs: *needs

  set_thermostat_fan:
    title: Set the thermostat's fan
    topic: thermostat
    icon: mdi:fan
    description: den Lüftermodus des Thermostats einstellen
    # "Stell den Lüftermodus auf Automatik", "schalte den Thermostatlüfter an".
    # A fan alone is a fan's: "schalte den Ventilator ein".
    require: [[lüftermodus, lüfterstufe, thermostatlüfter, lüfter des thermostats]]
    optional: [[stelle, stell, setze, setz, schalte, schalt, mach, mache, wechsle, wechsel], [modus, stufe], [auf]]
    exclude: [was, wie, worauf, ist]
    lists:
      mode: {list: fan_modes}
    home: climate
    supports: {fan_mode: mode}
    action:
      - action: climate.set_fan_mode
        target:
          entity_id: "{{ slots.entity }}"
        data:
          fan_mode: "{{ slots.mode }}"
    verbosity: specific
    response:
      done:
        brief: Lüfter des Thermostats eingestellt.
        specific: >-
          {%- set mode = slots.mode | lower | replace('_', ' ') -%}
          {%- set words = {'auto': 'Automatik', 'on': 'an', 'off': 'aus', 'low': 'niedrig', 'medium': 'mittel',
            'high': 'hoch', 'circulate': 'Umluft'} -%}
          {%- set ns = namespace(said=[]) -%}
          {%- for w in mode.split() -%}{%- set ns.said = ns.said + [words.get(w, w)] -%}{%- endfor -%}
          {%- if mode == 'on' -%}Lüfter des Thermostats eingeschaltet.
          {%- elif mode == 'off' -%}Lüfter des Thermostats ausgeschaltet.
          {%- else -%}Lüfter des Thermostats auf {{ ns.said | join(' ') }} gestellt.
          {%- endif -%}
    needs:
      - Set the home's thermostat in Settings, or give it one of its own
        (its implied target). Its fan modes are matched by their words to the
        fan_modes list's (Names page).
