# Lists (German), as the English library's todo.yaml: the shopping list and
# the to-do list (Aufgabenliste): adding to them, checking off, taking off,
# and what's on them.
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: etwas auf die Einkaufsliste setzen
    require: [[setze, setz, füge, füg, schreibe, schreib, packe, pack], [einkaufsliste]]
    optional: [[auf, zur, zu], [hinzu, dazu]]
    exclude: [aufgabenliste, to do, todo]
    wildcard:
      slot: item
      after: [setze, setz, füge, füg, schreibe, schreib, packe, pack]
      before: [auf, zur, zu]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("Orangen und Bananen": two), unless the list has one
    # called that whole ("Salz und Pfeffer"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Auf die Einkaufsliste gesetzt.
        specific: "{{ slots.item }} auf die Einkaufsliste gesetzt."
        verbose: >-
          {%- if added -%}
          {{ added }} auf die Einkaufsliste gesetzt{{ ' und ' ~ put_back ~ ' wieder draufgesetzt' if put_back }}.
          {%- else -%}
          {{ put_back }} wieder auf die Einkaufsliste gesetzt.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: etwas von der Einkaufsliste nehmen
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "Test drei" is
    # "Test 3"; "Äpfel und Bananen" two of them (items), unless one is called
    # that.
    require: [[nimm, entferne, entfern, lösche, lösch, streiche, streich], [einkaufsliste]]
    optional: [[von], [runter, herunter, weg]]
    exclude: [aufgabenliste, to do, todo]
    wildcard:
      slot: item
      after: [nimm, entferne, entfern, lösche, lösch, streiche, streich]
      before: [von]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Von der Einkaufsliste genommen.
        specific: "{{ slots.item }} von der Einkaufsliste genommen."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: etwas auf der Einkaufsliste als gekauft abhaken
    # Done, and kept on the list as such: "hak die Milch auf der Einkaufsliste
    # ab", "markiere Brot auf der Einkaufsliste als erledigt", "hak Äpfel und
    # Bananen auf der Einkaufsliste ab" (each of the items).
    require: [[hake, hak, abhaken, markiere, markier, durchstreichen], [einkaufsliste]]
    optional: [[ab], [auf, von], [als erledigt, als gekauft]]
    exclude: [aufgabenliste, to do, todo]
    wildcard:
      slot: item
      after: [hake, hak, markiere, markier]
      before: [auf, von, als erledigt, als gekauft]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Abgehakt.
        specific: "{{ slots.item }} auf der Einkaufsliste abgehakt."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: sagen, was auf der Einkaufsliste steht
    # What is still to get; what was checked off is left out.
    examples: ["was steht auf [der|meiner|unserer] einkaufsliste", "was müssen wir einkaufen", "lies [mir] die einkaufsliste vor"]
    require: [[was steht, was ist, lies, vorlesen, sag mir], [einkaufsliste]]
    optional: [[auf, vor], [unserer, unsere]]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        Die Einkaufsliste ist leer.
        {%- elif count == 1 -%}
        Auf der Einkaufsliste steht {{ listed[0] }}.
        {%- elif count > 8 -%}
        Auf der Einkaufsliste stehen {{ count }} Sachen: {{ listed[:5] | join(', ') }} und {{ count - 5 }} weitere.
        {%- else -%}
        Auf der Einkaufsliste stehen {{ listed[:-1] | join(', ') }} und {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

