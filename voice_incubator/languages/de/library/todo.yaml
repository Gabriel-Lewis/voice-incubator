    response:
      done:
        brief: Auf die Aufgabenliste gesetzt.
        specific: "{{ slots.item }} auf die Aufgabenliste gesetzt."
        verbose: "{{ (added ~ ' auf die Aufgabenliste gesetzt') if added else (put_back ~ ' wieder auf die Aufgabenliste gesetzt') }}."
    needs:
