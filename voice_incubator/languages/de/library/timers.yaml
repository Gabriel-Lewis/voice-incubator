# Timers (German), as the English library's timers.yaml: on the satellite that
# set them, with the Voice Incubator integration in Home Assistant. A timer is
# picked out by:
#   timer_name  a running timer's name: "brich den Pizza Timer ab"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "ein Timer namens Nudeln"
#   duration    "der 5 Minuten Timer"
# or it is the only one running. What they say is the language's (its speech
# module's timer sentences).
#
# Timers are the satellite's own, so they have no versions (variants) for a
# device or a place named. Alarms and reminders with a time are events on the
# Voice Incubator calendar in Home Assistant, which the app makes, and ring the
# satellite that set them (the language's calendar module reads when).
title: Timers and alarms
icon: mdi:timer-outline

# Commands shown together in Add a command: each one's topic.
topics:
  timers: {title: Timers, icon: mdi:timer-outline}
  alarms: {title: Alarms, icon: mdi:alarm}

commands:
  start_timer:
    title: Start a timer
    topic: timers
    icon: mdi:timer-plus-outline
    description: einen Timer stellen
    # "Timer für 5 Minuten", "stell einen Pizza Timer auf 10 Minuten".
    require: [[timer], [minuten, minute, sekunden, sekunde, stunden, stunde]]
    optional: [[stelle, stell, starte, start, setze, setz, erstelle, mach], [für, auf], [namens, genannt]]
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    topic: alarms
    icon: mdi:alarm
    description: einen Wecker stellen
    # On the Voice Incubator calendar in Home Assistant: "stell einen Wecker
    # für halb acht", "weck mich um 6 Uhr", "ein Wecker für morgen früh um
    # halb sieben", "ein Wecker für jeden Werktag um 6:45", "Wecker morgen um
    # 8", "ein Wecker in 20 Minuten". Without morgens or abends it is the next
    # time that comes round; on another day, the morning.
    require: [[wecker, weck mich, wecke mich]]
    optional: [[stelle, stell, setze, setz, mach, mache, erstelle], [für, um, auf, in]]
    wildcard: {slot: time, after: [wecker, für, um, auf, in, weck mich, wecke mich], to_end: true, max_words: 9}
    exclude: [was, wann, welche, welcher, lösche, lösch, löschen, entferne, abbrechen, brich, deaktiviere, aus,
              ausschalten, ab]
    timer: alarm
    verbosity: specific
    response:
      missing_time: Für wann soll ich den Wecker stellen?

  cancel_alarm:
    title: Cancel an alarm
    topic: alarms
    icon: mdi:alarm-off
    description: einen Wecker löschen
    # "Lösche meinen Wecker", "lösche den Wecker um sieben", "schalte den
    # Wecker für morgen aus". Said over a ringing alarm without a time, it
    # only stops it.
    require: [[lösche, lösch, löschen, entferne, entfern, abbrechen, brich ... ab, deaktiviere, deaktivieren,
               schalte ... aus, schalt ... aus, ausschalten, stelle ... ab, stell ... ab, abstellen], [wecker]]
    optional: [[für, um, von]]
    wildcard: {slot: time, before: [wecker], after: [für, um, von], max_words: 6}
    combinations: [[], [time]]
    timer: cancel_alarm
    verbosity: specific

  alarm_status:
    title: Say the alarms
    topic: alarms
    icon: mdi:alarm-check
    description: sagen, welche Wecker gestellt sind
    examples: ["welche wecker habe ich", "wann klingelt mein wecker", "habe ich einen wecker [gestellt]", "ist ein wecker gestellt"]
    require: [[wecker]]
    optional: [[was, wann, welche, welcher], [ist, sind, klingelt], [habe ich, hab ich, gibt es], [gestellt]]
    exclude: [lösche, lösch, löschen, entferne, abbrechen, brich, deaktiviere, aus, ausschalten, ab, stelle, stell,
              setze, setz, für, um]
    timer: alarm_status

  cancel_timer:
    title: Cancel a timer
    topic: timers
    icon: mdi:timer-off-outline
    description: einen Timer abbrechen
    require: [[abbrechen, brich ... ab, stoppe, stopp, stoppen, lösche, lösch, löschen, beende, beenden], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    topic: timers
    icon: mdi:timer-cancel-outline
    description: alle Timer abbrechen
    require: [[abbrechen, brich ... ab, stoppe, stopp, stoppen, lösche, lösch, löschen, beende, beenden], [alle], [timer]]
    timer: cancel_all
    verbosity: specific
    # More than one running: asked first.
    confirm: "{{ timers | count > 1 }}"
    response:
      confirm: "Alle {{ timers | count }} Timer abbrechen?"

  pause_timer:
    title: Pause a timer
    topic: timers
    icon: mdi:timer-pause-outline
    description: einen Timer pausieren
    require: [[pausiere, pausier, pausieren, anhalten, halt ... an, halte ... an], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    topic: timers
    icon: mdi:timer-play-outline
    description: einen Timer fortsetzen
    require: [[fortsetzen, setze ... fort, setz ... fort, weiterlaufen, lass ... weiterlaufen], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    topic: timers
    icon: mdi:timer-sand
    description: sagen, wie lange ein Timer noch läuft
    examples: ["wie viel zeit ist noch übrig", "wie lange läuft der timer noch"]
    require: [[wie lange, wie viel zeit], [noch, übrig]]
    optional: [[ist, läuft, hat], [auf], [timer], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    topic: timers
    icon: mdi:clock-plus-outline
    description: einem Timer Zeit hinzufügen
    # "Füge 5 Minuten zum Pizza Timer hinzu", "verlängere den Timer um 5 Minuten".
    require: [[füge, füg, hinzufügen, verlängere, verlänger, verlängern], [timer]]
    optional: [[zum, um], [hinzu], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    topic: timers
    icon: mdi:clock-minus-outline
    description: einem Timer Zeit abziehen
    # "Zieh 2 Minuten vom Timer ab", "verkürze den Pizza Timer um 2 Minuten".
    require: [[ziehe ... ab, zieh ... ab, abziehen, verkürze, verkürz, verkürzen, verringere, verringern, reduziere, reduzieren], [timer]]
    optional: [[vom, von, um], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
