# Lists (Ukrainian), as the English library's todo.yaml: the shopping list and
# the to-do list -- adding to them, checking off, taking off, and what's on
# them. Taking off is "видали" or "прибери"; checking off (done, and kept on
# the list) "відміть", "познач" or "викресли". Items are named after a colon
# where they would have to agree ("Видалено зі списку покупок: молоко"). The
# speaker's own to-do list is "мій список справ" (People page): the home's
# commands leave it to them.
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: додати щось до списку покупок
    require: [[додай, додайте, запиши, запишіть, внеси, допиши], [список покупок, списку покупок, покупки, покупок,
              список, списку]]
    optional: [[до, в, у, на]]
    exclude: [справ, справи, завдань]
    wildcard:
      slot: item
      after: [додай, додайте, запиши, запишіть, внеси, допиши]
      before: [до, в, у, на]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("яблука і банани": two), unless the list has one
    # called that whole ("хліб з маслом"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Додано до списку покупок.
        specific: "Додано {{ slots.item }} до списку покупок."
        verbose: >-
          {%- if added -%}
          Додано {{ added }} до списку покупок{{ ', а ' ~ put_back ~ ' повернуто в список' if put_back }}.
          {%- else -%}
          Повернуто до списку покупок: {{ put_back }}.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: прибрати щось зі списку покупок
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "тест три" is "тест
    # 3"; "яблука і банани" two of them (items), unless one is called that.
    require: [[видали, видаліть, прибери, приберіть, вилучи, забери], [список покупок, списку покупок, покупок,
              список, списку]]
    optional: [[зі, з, із]]
    exclude: [справ, справи, завдань]
    wildcard:
      slot: item
      after: [видали, видаліть, прибери, приберіть, вилучи, забери]
      before: [зі, з, із]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Видалено зі списку покупок.
        specific: "Видалено зі списку покупок: {{ slots.item }}."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: відмітити щось у списку покупок як куплене
    # Done, and kept on the list as such: "викресли молоко зі списку
    # покупок", "відміть яйця у списку покупок", "познач хліб як куплений у
    # списку", "викресли яблука і банани зі списку покупок" (each of the items).
    require: [[відміть, відмітьте, познач, позначте, викресли, викресліть], [список покупок, списку покупок, покупок,
              список, списку]]
    optional: [[у, в, зі, з, із, на], [як куплене, як куплений, як куплена, як куплені, куплене, куплено]]
    exclude: [справ, справи, завдань]
    wildcard:
      slot: item
      after: [відміть, відмітьте, познач, позначте, викресли, викресліть]
      before: [у, в, зі, з, із, на, як куплене, як куплений, як куплена, як куплені]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Відмічено.
        specific: "Відмічено у списку покупок: {{ slots.item }}."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: сказати, що в списку покупок
    # What is still to get; what was checked off is left out.
    examples: ["що (в|у) [нашому] списку покупок", "що треба купити", "що потрібно купити (в|у) магазині",
               "прочитай [мені] список покупок"]
    require: [[що, прочитай, зачитай, скажи, озвуч], [список покупок, списку покупок]]
    optional: [[мені], [є, наш, нашому]]
    exclude: [додай, запиши, внеси, видали, прибери, вилучи, викресли, відміть, познач]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        Список покупок порожній.
        {%- elif count == 1 -%}
        У списку покупок: {{ listed[0] }}.
        {%- elif count > 8 -%}
        У списку покупок {{ count }} {{ 'пункт' if count % 10 == 1 and count % 100 != 11 else ('пункти' if count % 10
          in [2, 3, 4] and count % 100 not in [12, 13, 14] else 'пунктів') }}: {{ listed[:5] | join(', ') }} і ще {{ count - 5 }}.
        {%- else -%}
        У списку покупок: {{ listed[:-1] | join(', ') }} і {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  todo_add:
    title: Add to the to-do list
    topic: todo_list
    icon: mdi:format-list-checks
    description: додати щось до списку справ
    require: [[додай, додайте, запиши, запишіть, внеси], [список справ, списку справ, справи, справ, список завдань,
              списку завдань, завдання]]
    optional: [[до, в, у]]
    # Someone's own is Add to my to-do list.
    exclude: [мого, мій, моїх, мої]
    wildcard:
      slot: item
      after: [додай, додайте, запиши, запишіть, внеси]
      before: [до, в, у]
      bounded: true
      max_words: 8
    home: todo_list
    # The whole of it: one the list has already isn't added again
    # (already_on_list).
    adds_to_list: {slot: item, list: entity}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Додано до списку справ.
        specific: "Додано {{ slots.item }} до списку справ."
        verbose: "{{ ('Додано ' ~ added ~ ' до списку справ') if added else ('Повернуто до списку справ: ' ~ put_back) }}."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_remove:
    title: Take off the to-do list
    topic: todo_list
    icon: mdi:playlist-remove
    description: прибрати щось зі списку справ
    # Gone from the list; checking it off (done, and kept) is Check off the
