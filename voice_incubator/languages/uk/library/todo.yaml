      before: [зі, з, із]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: todo_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Видалено зі списку справ.
        specific: "Видалено зі списку справ: {{ slots.item }}."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_check:
    title: Check off the to-do list
    topic: todo_list
    icon: mdi:playlist-check
    description: відмітити щось у списку справ як виконане
    # Done, and kept on the list as such: "відміть подзвонити сантехніку в
    # списку справ", "познач податки і прання як виконане у списку справ".
    require: [[відміть, відмітьте, познач, позначте, викресли, викресліть], [список справ, списку справ, справ,
              списку завдань, завдань]]
    optional: [[у, в, зі, з, із, на], [як виконане, як зроблене, виконане, зроблене, виконано, зроблено]]
    exclude: [мого, мій, моєму, моїх, мої]
    wildcard:
      slot: item
      after: [відміть, відмітьте, познач, позначте, викресли, викресліть]
      before: [у, в, зі, з, із, на, як виконане, як зроблене]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: todo_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Відмічено.
        specific: "Відмічено у списку справ: {{ slots.item }}."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_items:
    title: What's on the to-do list
    topic: todo_list
    icon: mdi:format-list-bulleted
    description: сказати, що в списку справ
    # What is still to do; what was checked off is left out. Someone's own
    # is What's on my to-do list.
    examples: ["що (в|у) [нашому] списку справ", "прочитай [мені] [наш] список справ"]
    require: [[що, прочитай, зачитай, скажи, озвуч], [список справ, списку справ, список завдань, списку завдань]]
    optional: [[мені], [є, наш, нашому]]
    exclude: [мого, мій, моєму, моїх, мої, додай, запиши, внеси, видали, прибери, вилучи, викресли, відміть, познач]
    home: todo_list
    action:
      - variables:
          todo: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ todo }}"
        data:
