        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        Список справ порожній.
        {%- elif count == 1 -%}
        У списку справ: {{ listed[0] }}.
        {%- elif count > 8 -%}
        У списку справ {{ count }} {{ 'пункт' if count % 10 == 1 and count % 100 != 11 else ('пункти' if count % 10
          in [2, 3, 4] and count % 100 not in [12, 13, 14] else 'пунктів') }}: {{ listed[:5] | join(', ') }} і ще {{ count - 5 }}.
        {%- else -%}
        У списку справ: {{ listed[:-1] | join(', ') }} і {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_add_mine:
    title: Add to my to-do list
    topic: todo_list
    icon: mdi:account-check-outline
    description: додати щось до мого списку справ
    # The speaker's own (People page); where nobody has one, this one.
    require: [[додай, додайте, запиши, запишіть, внеси], [мого списку справ, мій список справ, моїх справ,
              мого списку завдань, моїх завдань]]
    optional: [[до, в, у]]
    wildcard:
      slot: item
      after: [додай, додайте, запиши, запишіть, внеси]
      before: [до, в, у]
      bounded: true
      max_words: 8
    home: todo_list
    mine: todo_list
    # The whole of it: one the list has already isn't added again
    # (already_on_list).
    adds_to_list: {slot: item, list: entity}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Додано до твого списку справ.
        specific: "Додано {{ slots.item }} до твого списку справ."
        verbose: "{{ ('Додано ' ~ added ~ ' до твого списку справ') if added else ('Повернуто до твого списку справ: ' ~ put_back) }}."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it adds to the home's (Settings).

  todo_remove_mine:
    title: Take off my to-do list
    topic: todo_list
    icon: mdi:account-remove-outline
    description: прибрати щось з мого списку справ
    # The speaker's own (People page); where nobody has one, this one. The
    # items said are ones on it, as for the to-do list's.
    require: [[видали, видаліть, прибери, приберіть, вилучи, забери], [мого списку справ, моїх справ,
              мого списку завдань, моїх завдань]]
    optional: [[зі, з, із]]
    wildcard:
      slot: item
      after: [видали, видаліть, прибери, приберіть, вилучи, забери]
      before: [зі, з, із]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: todo_list
    mine: todo_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Видалено з твого списку справ.
        specific: "Видалено з твого списку справ: {{ slots.item }}."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it takes off the home's (Settings).

  todo_check_mine:
    title: Check off my to-do list
    topic: todo_list
    icon: mdi:account-check
    description: відмітити щось у моєму списку справ як виконане
    # The speaker's own (People page); where nobody has one, this one. Done,
    # and kept on the list as such.
    require: [[відміть, відмітьте, познач, позначте, викресли, викресліть], [моєму списку справ, мого списку справ,
              моїх справ, моїх завдань]]
    optional: [[у, в, зі, з, із, на], [як виконане, як зроблене, виконане, зроблене, виконано, зроблено]]
    wildcard:
      slot: item
      after: [відміть, відмітьте, познач, позначте, викресли, викресліть]
      before: [у, в, зі, з, із, на, як виконане, як зроблене]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: todo_list
    mine: todo_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Відмічено.
        specific: "Відмічено у твоєму списку справ: {{ slots.item }}."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it checks off the home's (Settings).

  todo_items_mine:
    title: What's on my to-do list
    topic: todo_list
    icon: mdi:account-details-outline
    description: сказати, що в моєму списку справ
    # The speaker's own (People page); where nobody has one, the home's. What
    # is still to do; what was checked off is left out.
    examples: ["що (в|у) моєму списку справ", "прочитай [мені] мій список справ", "які (в|у) мене справи"]
    require: [[що, прочитай, зачитай, скажи, озвуч], [моєму списку справ, мій список справ, мого списку справ]]
    optional: [[мені]]
    exclude: [додай, запиши, внеси, видали, прибери, вилучи, викресли, відміть, познач]
    home: todo_list
    mine: todo_list
    action:
      - variables:
          todo: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ todo }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[todo]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        Твій список справ порожній.
        {%- elif count == 1 -%}
        У твоєму списку справ: {{ listed[0] }}.
        {%- elif count > 8 -%}
        У твоєму списку справ {{ count }} {{ 'пункт' if count % 10 == 1 and count % 100 != 11 else ('пункти' if count % 10
