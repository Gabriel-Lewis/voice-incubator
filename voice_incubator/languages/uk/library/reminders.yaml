# Reminders and calendar (Ukrainian), as the English library's
# reminders.yaml: reminders, and what's on the speaker's calendar. When a
# reminder is for is read by the language's calendar.py ("о п'ятій вечора",
# "завтра о дев'ятій", "щовівторка о сьомій", "через десять хвилин").
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: розповісти, що в моєму календарі на сьогодні
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["що (в|у) моєму календарі [на сьогодні]", "що (в|у) мене (в|у) календарі [на сьогодні]",
               "що (в|у) мене сьогодні", "що (в|у) мене в планах [на сьогодні]", "що (в|у) моєму розкладі [на сьогодні]"]
    require: [[календар, календарі, календаря, розклад, розкладі, розкладу, плани, планах]]
    optional: [[що, які], [в мене, у мене], [сьогодні, на сьогодні]]
    exclude: [додай, постав, нагадай, скасуй, видали]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    # The events are named after a colon: a name can't be declined.
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}У твоєму календарі на сьогодні більше нічого немає.
        {% elif events | count == 1 %}Сьогодні в календарі: {{ events[0] }}.
        {% else %}Сьогодні в календарі: {{ events[:-1] | join(', ') }} і {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: додати нагадування
    # With a time, an event on the Voice Incubator calendar that is said on this
    # satellite then: "нагадай мені о п'ятій вечора подзвонити мамі",
    # "нагадай винести сміття щовівторка о сьомій вечора", "нагадай через
    # десять хвилин перевірити духовку". Without one, it goes on the to-do
    # list: "нагадай, що треба купити хліб".
    require: [[нагадай, нагадайте, нагадати]]
    optional: [[мені, нам]]
    wildcard:
      slot: reminder
      after: [нагадай, нагадайте, нагадати, мені, нам]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: скасувати нагадування
    # On the Voice Incubator calendar, by what it is about, when it is, or both:
    # "скасуй нагадування подзвонити мамі", "видали нагадування на завтра",
    # "скасуй нагадування про стоматолога", "скасуй нагадування на п'яту
    # вечора"; with one, the only one.
    require: [[скасуй, скасуйте, скасувати, видали, видаліть, прибери, відміни, забудь], [нагадування, нагадувань]]
    optional: [[моє, мої, всі, усі]]
    wildcard: {slot: reminder, after: [нагадування, нагадувань], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: сказати, які є нагадування
    examples: ["які (в|у) мене нагадування", "чи є (в|у) мене нагадування", "які є нагадування", "мої нагадування"]
    require: [[нагадування, нагадувань]]
    optional: [[які, чи є, є, чи], [в мене, у мене, мої]]
    exclude: [нагадай, додай, постав, скасуй, видали, видаліть, прибери, забудь]
    timer: reminder_status
