# Lights and switches (Ukrainian), as the English library's lights.yaml: on
# and off, brightness, color, and asking which are on.
#
# "Вимкни" must beat the on-words by a margin (the language's contrasts): the
# model hears "ввімкни" as off. Lights are "світло" (the lights of a place),
# or a lamp in its case: "лампу", "люстру".
title: Lights and switches
icon: mdi:lightbulb-outline

# Commands shown together in Add a command: each one's topic.
topics:
  on_and_off: {title: On and off, icon: mdi:lightbulb-on-outline}
  brightness_and_color: {title: Brightness and color, icon: mdi:brightness-6}

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).
  # 30 percent brighter or dimmer (slots.step), never to off: the lights that
  # are on here, or in an area or floor named, of those added there (Names) --
  # no intent changes brightness by a step -- or a light by name, which
  # comes on to be brightened.
  brightness_step: &brightness_step
    - variables:
        none_on: {outcome: no_lights}
        lights: >-
          {%- if slots.entity -%}
          {{ (slots.entity | select('is_state', 'on') | list) if slots.step | int < 0 else slots.entity }}
          {%- else -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for s in states.light if devices.get(s.entity_id) in place.areas and s.state == 'on'
            and s.attributes.supported_color_modes != ['onoff'] -%}
          {%- set ns.ids = ns.ids + [s.entity_id] -%}
          {%- endfor -%}
          {{ ns.ids }}
          {%- endif -%}
    - if: "{{ not lights }}"
      then:
        - stop: No lights to change
          response_variable: none_on
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >-
                {{ [[((state_attr(repeat.item, 'brightness') or 0) / 2.55) | round(0) + slots.step | int, 1] | max, 100] | min | int }}
  brightness_said: &brightness_said
    no_lights: >-
      {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': вимкнено.') if slots.entity
      else 'Світло ' ~ place.said ~ ' не горить.' }}

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    topic: on_and_off
    icon: mdi:lightbulb-on-outline
    description: увімкнути світло
    require: [[світло, лампу, лампи, лампа, лампочку, люстру, освітлення, підсвітку],
              [увімкни, ввімкни, увімкніть, ввімкніть, умкни, увімкне, ввімкне, включи, увімкнути, ввімкнути, запали,
               засвіти]]
    optional: [[все, усе, всі, усі], [всюди, скрізь, у всьому будинку, в усьому будинку, у всьому домі, в усьому домі]]
    exclude: [вимкни, вимкніть, вимкнути, виключи, погаси, чи, колір, яскравість]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Світло увімкнено.
        specific: Світло {{ place.said }} увімкнено.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 -%}
          Світло {{ place.said }} увімкнено.
          {%- elif n > 4 -%}
          Увімкнено {{ n }} {{ 'лампу' if n % 10 == 1 and n % 100 != 11 else ('лампи' if n % 10 in [2, 3, 4]
            and n % 100 not in [12, 13, 14] else 'ламп') }} {{ place.said }}.
          {%- else -%}
          Увімкнено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' і ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: увімкнути пристрій
        require: [[увімкни, ввімкни, увімкніть, ввімкніть, умкни, увімкне, ввімкне, включи, увімкнути, ввімкнути]]
        exclude: [вимкни, вимкніть, вимкнути, виключи, чи, музику, звук]
        intent: HassTurnOn
        response:
          done:
            brief: Увімкнено.
            specific: "Увімкнено: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Увімкнено {{ place.said }}: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    topic: on_and_off
    icon: mdi:lightbulb-off-outline
    description: вимкнути світло
    require: [[світло, лампу, лампи, лампа, лампочку, люстру, освітлення, підсвітку],
              [вимкни, вимкніть, вимкнути, виключи, погаси, погасіть, загаси]]
    optional: [[все, усе, всі, усі], [всюди, скрізь, у всьому будинку, в усьому будинку, у всьому домі, в усьому домі]]
    exclude: [увімкни, ввімкни, увімкніть, ввімкніть, увімкнути, включи, чи]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Світло вимкнено.
        specific: Світло {{ place.said }} вимкнено.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 -%}
          Світло {{ place.said }} вимкнено.
          {%- elif n > 4 -%}
          Вимкнено {{ n }} {{ 'лампу' if n % 10 == 1 and n % 100 != 11 else ('лампи' if n % 10 in [2, 3, 4]
            and n % 100 not in [12, 13, 14] else 'ламп') }} {{ place.said }}.
          {%- else -%}
          Вимкнено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' і ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: вимкнути пристрій
        require: [[вимкни, вимкніть, вимкнути, виключи]]
        exclude: [увімкни, ввімкни, увімкніть, увімкнути, включи, чи, музику, звук, таймер, будильник]
        intent: HassTurnOff
        response:
          done:
            brief: Вимкнено.
            specific: "Вимкнено: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Вимкнено {{ place.said }}: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    topic: on_and_off
    icon: mdi:lightbulb-question
    description: дізнатися, де горить світло
    # No example sentences: one said word for word carries no area or floor.
    require: [[чи, де], [світло, лампа, лампи, лампочка, люстра], [горить, горять, увімкнене, увімкнено, увімкнена,
              увімкнені, ввімкнене, ввімкнено, світить, світиться]]
    optional: [[десь, ще, досі, якесь, якась, якісь]]
    exclude: [увімкни, ввімкни, вимкни, включи, погаси]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Ні, світло{{ where }} не горить.
      {%- elif count > 3 -%}
      Так, {{ where | trim ~ ' ' if where else '' }}горить {{ count }} {{ 'лампа' if count % 10 == 1 and count % 100 != 11
        else ('лампи' if count % 10 in [2, 3, 4] and count % 100 not in [12, 13, 14] else 'ламп') }}.
      {%- else -%}
      Так, горить: {{ (ns.on[:-1] | join(', ') ~ ' і ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (set on its page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: дізнатися, чи увімкнений пристрій
        # "Чи" may be left out, as it often is: "Торшер увімкнений?".
        require: null
        optional: [[чи], [ще, досі, зараз]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        # Said with a verb, which agrees with no name: "Торшер горить",
        # "Вентилятор не працює".
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set verb = 'горить' if e.startswith('light.') else 'працює' -%}
          {%- set name = names.get(e, state_attr(e, 'friendly_name')) -%}
          {%- if state == 'on' -%}
          {{ 'Так' if slots.asked == 'on' else 'Ні' }}, {{ name }} {{ verb }}.
          {%- elif state == 'off' -%}
          {{ 'Так' if slots.asked == 'off' else 'Ні' }}, {{ name }} не {{ verb }}.
          {%- else -%}
          {{ name }}: {{ {'unavailable': 'недоступно', 'unknown': 'у невідомому стані'}.get(state, state) }}.
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    topic: brightness_and_color
    icon: mdi:brightness-6
    description: змінити яскравість світла
    supports: brightness
    require: [[яскравість, яскравості, відсотків, відсотки, відсоток]]
    optional: [[встанови, встановіть, постав, зроби, зміни, збав, приглуши, налаштуй], [світло, лампу, лампи, люстру],
               [яскравість], [відсотків, відсотки, відсоток, відсотка], [на, до]]
    # A question: "скільки буде 15 відсотків від 80".
    exclude: [скільки, що, яка, який, обчисли, порахуй, від, гучність, звук]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Яскравість змінено.
        specific: >-
          {%- set p = slots.percentage | int -%}
          {%- set word = 'відсоток' if p % 10 == 1 and p % 100 != 11 else ('відсотки' if p % 10 in [2, 3, 4]
            and p % 100 not in [12, 13, 14] else 'відсотків') -%}
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': яскравість') if slots.entity
          else 'Яскравість ' ~ place.said ~ ':' }} {{ p }} {{ word }}.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    topic: brightness_and_color
    icon: mdi:format-color-fill
    description: змінити колір світла
    supports: color
    # "Зроби світло синім", "зміни колір лампи на червоний", "постав торшер на зелений".
    require: [[зроби, зміни, постав, встанови, колір, кольором], [світло, світла, лампу, лампи, люстру, підсвітку,
              освітлення]]
    optional: [[колір, кольору, кольором], [на]]
    exclude: [яскравість, температуру, відсотків]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Колір змінено.
        specific: >-
          {%- set colors = {'red': ['червоний', 'червоне'], 'orange': ['помаранчевий', 'помаранчеве'],
            'yellow': ['жовтий', 'жовте'], 'green': ['зелений', 'зелене'], 'blue': ['синій', 'синє'],
            'purple': ['фіолетовий', 'фіолетове'], 'pink': ['рожевий', 'рожеве'], 'white': ['білий', 'біле'], 'turquoise': ['бірюзовий', 'бірюзове'], 'magenta': ['пурпуровий', 'пурпурове']} -%}
          {%- set color = colors.get(slots.color, [slots.color, slots.color]) -%}
          {%- if slots.entity -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}: колір {{ color[0] }}.
          {%- else -%}
          Світло {{ place.said }} тепер {{ color[1] }}.
          {%- endif -%}
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[зроби, зміни, постав, встанови, колір, кольором]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  brighter:
    title: Brighter
    topic: brightness_and_color
    icon: mdi:brightness-7
    description: зробити світло яскравішим
    supports: brightness
    # "Зроби світло яскравіше", "яскравіше", "додай світла"; до числа --
    # Set the brightness.
    require: [[яскравіше, світліше, збільш яскравість, збільш ... яскравість, підвищ яскравість,
               підвищ ... яскравість, додай яскравості, додай світла]]
    optional: [[зроби, трохи, ще], [світло, лампу, лампи, люстру, освітлення]]
    exclude: [чи, гучність, звук, музику, температуру, відсотків, відсотки, відсоток, відсотка]
    slots: {step: 30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Яскравіше.
        specific: >-
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': яскравіше') if slots.entity
          else 'Світло ' ~ place.said ~ ' тепер яскравіше' }}.
    variants:
      here:
        title: Brighter in this satellite's area
        examples: ["[зроби] [трохи] (яскравіше|світліше)", "зроби світло [трохи] яскравіше", "додай світла"]
      device:
        <<: *device
        title: Brighten a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may brighten (Names page).
      place:
        <<: *place
        title: Brighter in an area or floor

  dimmer:
    title: Dimmer
    topic: brightness_and_color
    icon: mdi:brightness-4
    description: зробити світло тьмянішим
    supports: brightness
    # "Приглуши світло", "зроби тьмяніше", "зменш яскравість".
    require: [[тьмяніше, темніше, приглуши світло, притуши світло, зменш яскравість, зменш ... яскравість,
               знизь яскравість, знизь ... яскравість, менше світла]]
    optional: [[зроби, трохи, ще], [світло, лампу, лампи, люстру, освітлення]]
    exclude: [чи, гучність, звук, музику, температуру, відсотків, відсотки, відсоток, відсотка]
    slots: {step: -30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Тьмяніше.
        specific: >-
          {{ (names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ ': тьмяніше') if slots.entity
          else 'Світло ' ~ place.said ~ ' тепер тьмяніше' }}.
    variants:
      here:
        title: Dimmer in this satellite's area
        examples: ["[зроби] [трохи] (тьмяніше|темніше)", "приглуши світло", "зроби світло [трохи] тьмяніше"]
      device:
        <<: *device
        title: Dim a light by name
        # "Приглуши торшер".
        require: [[тьмяніше, темніше, приглуши, притуши, зменш яскравість, зменш ... яскравість, знизь яскравість,
                   знизь ... яскравість]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Dimmer in an area or floor

  light_temperature:
    title: Set the color temperature
    topic: brightness_and_color
    icon: mdi:white-balance-sunny
    description: змінити відтінок білого світла
    supports: color_temp
    # By what the white is called: тепле, м'яке, нейтральне, холодне, денне
    # (the color_temperatures list, in kelvin): "зроби світло теплим", "постав
    # на кухні холодне біле світло".
    require: [[зроби, зміни, постав, встанови, колірну температуру], [світло, світла, лампу, лампи, люстру,
              підсвітку, освітлення]]
    optional: [[колірну температуру, температуру, відтінок], [на]]
    exclude: [чи, яскравість, відсотків, градусів, градуси]
    lists:
      color_temperature: {list: color_temperatures}
    intent:
      name: HassLightSet
      slots: {temperature: "{{ slots.color_temperature }}"}
    verbosity: beep
    response:
      done:
        brief: Відтінок змінено.
        specific: >-
          {%- set whites = {'2700': 'теплий білий', '3000': "м'який білий", '4000': 'нейтральний білий',
            '5000': 'холодний білий', '6500': 'денне світло'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Світло ' ~ place.said }}: {{ whites.get(slots.color_temperature | string, slots.color_temperature | string ~ ' K') }}.
    variants:
      here:
        title: Set the color temperature in this satellite's area
      device:
        <<: *device
        title: Set the color temperature of a light by name
        require: [[зроби, зміни, постав, встанови, колірну температуру]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color_temperature], [entity, area, color_temperature]]
        needs:
          - Add names for the lights it may change (Names page).
      place:
        <<: *place
        title: Set the color temperature in an area or floor
        combinations: [[area, color_temperature], [floor, color_temperature]]
