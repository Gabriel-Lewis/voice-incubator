# Weather (Ukrainian), as the English library's weather.yaml: from the home's
# weather entity (Settings), or one a command is given (its implied target):
# now, on a day, this week, and whether it will rain or snow. The forecasts
# are its daily ones (weather.get_forecasts), so it must have them. A day is
# said from the forecast_days list: сьогодні, завтра, післязавтра, a day of
# the week (the next one), вихідні; what falls from weather_kinds: дощ (or a
# парасолька), сніг.
#
# Temperatures are said in the nominative after a noun ("максимум 18
# градусів"): after "до" or "від" a number would have to be in the genitive,
# which the voice doesn't read from digits.
title: Weather
icon: mdi:weather-partly-cloudy

# Commands shown together in Add a command: each one's topic.
topics:
  weather: {title: Weather, icon: mdi:weather-partly-cloudy}

# What the commands share (merged into them with <<, or as a whole).
shared:
  # The daily forecast, as the response's result.days.
  forecast: &forecast
    - action: weather.get_forecasts
      target:
        entity_id: "{{ slots.entity }}"
      data:
        type: daily
      response_variable: found
    - variables:
        reply:
          days: "{{ found[slots.entity[0]].forecast }}"
    - stop: Read the forecast
      response_variable: reply
  needs: &needs
    - Set the home's weather entity in Settings, or give it one of its
      own (its implied target). It needs daily forecasts.

commands:
  weather:
    title: What's the weather
    topic: weather
    icon: mdi:weather-partly-cloudy
    description: розповісти, яка зараз погода
    examples: ["яка [зараз] погода [надворі]", "яка погода [сьогодні]", "яка сьогодні погода", "що з погодою",
               "як там погода"]
    require: [[погода, погоду, погоди, погодою]]
    optional: [[зараз, надворі, на вулиці, там], [яка, як, що з]]
    # Not a timer's time: "скільки часу залишилось"; nor another day's
    # (The weather on a day).
    exclude: [залишилось, залишилося, таймер, будильник, скільки, буде, прогноз, тиждень, тижні, найближчі,
              найближчими]
    home: weather
    response: >-
      {%- set words = {'clear-night': 'ясно', 'cloudy': 'хмарно', 'exceptional': 'незвичайна погода',
        'fog': 'туман', 'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза з дощем',
        'partlycloudy': 'мінлива хмарність', 'pouring': 'злива', 'rainy': 'дощ', 'snowy': 'сніг',
        'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячно', 'windy': 'вітряно', 'windy-variant': 'вітряно і хмарно'} -%}
      {%- set state = states(slots.entity[0]) -%}
      {%- set t = state_attr(slots.entity[0], 'temperature') | float(0) | round | int -%}
      {%- set n = t | abs -%}
      Зараз {{ words.get(state, state) }}, {{ ('мінус ' ~ n) if t < 0 else t }} {{ 'градус' if n % 10 == 1 and n % 100 != 11
        else ('градуси' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів') }}.
    needs: *needs

  weather_day:
    title: The weather on a day
    topic: weather
    icon: mdi:weather-cloudy-clock
    description: розповісти прогноз погоди на день
    # "Яка погода буде завтра", "прогноз на суботу", "яка погода на
    # вихідних" (both days). No day said, as its examples: today's ("яка
    # буде погода").
    examples: ["яка буде погода", "який [буде] прогноз [погоди]", "що з прогнозом [погоди]"]
    require: [[погода, погоду, погоди, погодою, прогноз, прогнозу, прогнозом]]
    optional: [[яка, який, яке, що, як], [буде, обіцяють, кажуть, з]]
    exclude: [залишилось, залишилося, таймер, будильник, скільки, тиждень, тижні, найближчі, найближчими]
    lists:
      day: {list: forecast_days}
    home: weather
    action: *forecast
    response: >-
      {%- macro deg(t) -%}
      {%- set x = t | float(0) | round | int -%}
      {%- set n = x | abs -%}
      {{ ('мінус ' ~ n) if x < 0 else x }} {{ 'градус' if n % 10 == 1 and n % 100 != 11 else ('градуси'
        if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів') }}
      {%- endmacro -%}
      {%- set looks = {'clear-night': 'ясно', 'cloudy': 'хмарно', 'exceptional': 'незвичайна погода', 'fog': 'туман',
        'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза з дощем', 'partlycloudy': 'мінлива хмарність',
        'pouring': 'злива', 'rainy': 'дощ', 'snowy': 'сніг', 'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячно',
        'windy': 'вітряно', 'windy-variant': 'вітряно і хмарно'} -%}
      {%- set day = slots.day | default('today') -%}
      {%- set weekdays = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'] -%}
      {%- set on_day = ['у понеділок', 'у вівторок', 'у середу', 'у четвер', "у п'ятницю", 'у суботу', 'у неділю'] -%}
      {%- set for_day = ['понеділок', 'вівторок', 'середу', 'четвер', "п'ятницю", 'суботу', 'неділю'] -%}
      {%- set today = now().date() -%}
      {%- if day == 'weekend' -%}
        {%- set offsets = [0] if today.weekday() == 6 else [(5 - today.weekday()) % 7, (6 - today.weekday()) % 7] -%}
      {%- else -%}
        {%- set offsets = [0 if day == 'today' else 1 if day == 'tomorrow' else 2 if day == 'day_after_tomorrow'
          else (weekdays.index(day) - today.weekday()) % 7] -%}
      {%- endif -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for offset in offsets -%}
        {%- set date = today + timedelta(days=offset) -%}
        {%- set when = 'Сьогодні' if offset == 0 else 'Завтра' if offset == 1 else on_day[date.weekday()] | capitalize -%}
        {%- set ahead = 'сьогодні' if offset == 0 else 'завтра' if offset == 1 else for_day[date.weekday()] -%}
        {%- set on = namespace(f=none) -%}
        {%- for g in result.days or [] if on.f is none and (as_datetime(g.datetime) | as_local).date() == date -%}
          {%- set on.f = g -%}
        {%- endfor -%}
        {%- if on.f is not none -%}
          {%- set f = on.f -%}
          {%- set rain = (f.precipitation_probability | default(0) or 0) | round | int -%}
          {%- set ns.out = ns.out + [when ~ ' ' ~ looks.get(f.condition, f.condition) ~ ', максимум ' ~ deg(f.temperature)
            ~ (', мінімум ' ~ deg(f.templow) if f.templow is defined else '')
            ~ (', ймовірність дощу ' ~ rain ~ (' відсоток' if rain % 10 == 1 and rain % 100 != 11 else (' відсотки'
              if rain % 10 in [2, 3, 4] and rain % 100 not in [12, 13, 14] else ' відсотків')) if rain > 0 else '') ~ '.'] -%}
        {%- else -%}
          {%- set ns.out = ns.out + ['Прогнозу на ' ~ ahead ~ ' ще немає.'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out | join(' ') }}
    needs: *needs

  weather_week:
    title: The weather this week
    topic: weather
    icon: mdi:calendar-week
    description: розповісти прогноз погоди на тиждень
    examples: ["який прогноз [погоди] на тиждень", "яка погода [буде] на (тиждень|цьому тижні)",
               "яка погода [буде] (найближчими днями|на найближчі дні)"]
    require: [[погода, погоду, погоди, прогноз], [тиждень, тижні, найближчі дні, найближчими днями, наступні дні]]
    optional: [[яка, який, що, як], [буде, обіцяють, на, цьому, цей]]
    home: weather
    action: *forecast
    response: >-
      {%- macro deg(t) -%}
      {%- set x = t | float(0) | round | int -%}
      {%- set n = x | abs -%}
      {{ ('мінус ' ~ n) if x < 0 else x }} {{ 'градус' if n % 10 == 1 and n % 100 != 11 else ('градуси'
        if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів') }}
      {%- endmacro -%}
      {%- set looks = {'clear-night': 'ясна погода', 'cloudy': 'хмарна погода', 'exceptional': 'незвичайна погода',
        'fog': 'туманна погода', 'hail': 'грозова погода', 'lightning': 'грозова погода',
        'lightning-rainy': 'грозова погода', 'partlycloudy': 'мінлива хмарність', 'pouring': 'дощова погода',
        'rainy': 'дощова погода', 'snowy': 'снігова погода', 'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячна погода',
        'windy': 'вітряна погода', 'windy-variant': 'вітряна погода'} -%}
      {%- set on_day = ['у понеділок', 'у вівторок', 'у середу', 'у четвер', "у п'ятницю", 'у суботу', 'у неділю'] -%}
      {%- set wet = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] -%}
      {%- set days = (result.days or [])[:7] -%}
      {%- if not days -%}
      Прогнозу немає.
      {%- else -%}
      {%- set highs = days | map(attribute='temperature') | list -%}
      {%- set kinds = days | map(attribute='condition') | map('replace', 'pouring', 'rainy') | list -%}
      {%- set ns = namespace(top='', count=0, rainy=[]) -%}
      {%- for c in kinds | unique -%}
        {%- set n = kinds | select('eq', c) | list | count -%}
        {%- if n > ns.count -%}{%- set ns.top = c -%}{%- set ns.count = n -%}{%- endif -%}
      {%- endfor -%}
      {%- for f in days -%}
        {%- if f.condition in wet or (f.precipitation_probability | default(0) or 0) >= 50 -%}
          {%- set ns.rainy = ns.rainy + [on_day[(as_datetime(f.datetime) | as_local).weekday()]] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ('Переважно ' ~ looks.get(ns.top, ns.top)) if ns.count * 2 > days | count else 'Погода мінлива' }},
      найвища температура {{ deg(highs | max) }}, найнижча {{ deg(highs | min) }}.
      {% if ns.rainy %}Дощ імовірний {{ (ns.rainy[:-1] | join(', ') ~ ' і ' ~ ns.rainy[-1]) if ns.rainy | count > 1 else ns.rainy[0] }}.
      {%- else %}Дощу не очікується.{%- endif -%}
      {%- endif -%}
    needs: *needs

  will_it_rain:
    title: Will it rain
    topic: weather
    icon: mdi:weather-rainy
    description: сказати, чи буде дощ або сніг
    # "Чи буде завтра дощ", "чи піде сніг у суботу", "чи потрібна
    # парасолька", "чи буде дощ на вихідних". Nothing said: today.
    examples: ["чи буде дощ", "чи піде дощ", "чи потрібна парасолька [сьогодні]", "чи брати парасольку"]
    require: [[буде, піде, потрібна, потрібно, брати, взяти, очікується, ймовірність, імовірність]]
    optional: [[чи], [мені, нам]]
    lists:
      what: {list: weather_kinds}
      day: {list: forecast_days}
    combinations: [[what], [what, day]]
    home: weather
    action: *forecast
    response: >-
      {%- set looks = {'clear-night': 'ясно', 'cloudy': 'хмарно', 'exceptional': 'незвичайна погода', 'fog': 'туман',
        'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза з дощем', 'partlycloudy': 'мінлива хмарність',
        'pouring': 'злива', 'rainy': 'дощ', 'snowy': 'сніг', 'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячно',
        'windy': 'вітряно', 'windy-variant': 'вітряно і хмарно'} -%}
      {%- set what = slots.what | default('rain') -%}
      {%- set falls = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] if what == 'rain' else ['snowy', 'snowy-rainy'] -%}
      {%- set day = slots.day | default('today') -%}
      {%- set weekdays = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'] -%}
      {%- set on_day = ['у понеділок', 'у вівторок', 'у середу', 'у четвер', "у п'ятницю", 'у суботу', 'у неділю'] -%}
      {%- set today = now().date() -%}
      {%- if day == 'weekend' -%}
        {%- set offsets = [0] if today.weekday() == 6 else [(5 - today.weekday()) % 7, (6 - today.weekday()) % 7] -%}
      {%- else -%}
        {%- set offsets = [0 if day == 'today' else 1 if day == 'tomorrow' else 2 if day == 'day_after_tomorrow'
          else (weekdays.index(day) - today.weekday()) % 7] -%}
      {%- endif -%}
      {%- set ns = namespace(likely=[], chance=0, other='', known=false) -%}
      {%- for offset in offsets -%}
        {%- set date = today + timedelta(days=offset) -%}
        {%- set when = 'сьогодні' if offset == 0 else 'завтра' if offset == 1 else on_day[date.weekday()] -%}
        {%- set on = namespace(f=none) -%}
        {%- for g in result.days or [] if on.f is none and (as_datetime(g.datetime) | as_local).date() == date -%}
          {%- set on.f = g -%}
        {%- endfor -%}
        {%- if on.f is not none -%}
          {%- set f = on.f -%}
          {%- set rain = (f.precipitation_probability | default(0) or 0) | round | int -%}
          {%- if f.condition in falls or (what == 'rain' and rain >= 50) -%}
            {%- set ns.likely = ns.likely + [when] -%}
            {%- set ns.chance = rain if what == 'rain' and rain > ns.chance else ns.chance -%}
          {%- elif not ns.known -%}
            {%- set ns.other = (when[:1] | upper) ~ when[1:] ~ ' ' ~ looks.get(f.condition, f.condition)
              ~ (', ймовірність дощу ' ~ rain ~ (' відсоток' if rain % 10 == 1 and rain % 100 != 11 else (' відсотки'
                if rain % 10 in [2, 3, 4] and rain % 100 not in [12, 13, 14] else ' відсотків'))
                if what == 'rain' and rain > 0 else '') -%}
          {%- endif -%}
          {%- set ns.known = true -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set chance = ns.chance | int -%}
      {%- if ns.likely and chance and ns.likely | count == 1 -%}
      Так, {{ ns.likely[0] }} ймовірність дощу {{ chance }} {{ 'відсоток' if chance % 10 == 1 and chance % 100 != 11
        else ('відсотки' if chance % 10 in [2, 3, 4] and chance % 100 not in [12, 13, 14] else 'відсотків') }}.
      {%- elif ns.likely -%}
      Так, {{ 'дощ' if what == 'rain' else 'сніг' }} імовірний {{ ns.likely | join(' і ') }}.
      {%- elif ns.known and day == 'weekend' -%}
      Навряд чи, на вихідних не очікується.
      {%- elif ns.known -%}
      Навряд чи. {{ ns.other }}.
      {%- else -%}
      Прогнозу на такий далекий час ще немає.
      {%- endif -%}
    needs: *needs
