        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: Удалено из списка дел.
        specific: "Удалено из списка дел: {{ slots.item }}."
    needs:
      - Set the home's to-do list in Settings, or give it one of its
        own (its implied target).

  todo_check:
