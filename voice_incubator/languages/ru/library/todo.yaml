              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Добавлено в ваш список дел.
        specific: "Добавлено в ваш список дел: {{ slots.item }}."
        verbose: "{{ ('Добавлено в ваш список дел: ' ~ added) if added else ('Снова в вашем списке дел: ' ~ put_back) }}."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it adds to the home's (Settings).

