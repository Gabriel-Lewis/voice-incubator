    require: [[что, прочитай, прочти, зачитай, огласи, скажи, покажи],
              [списке дел, список дел, списке задач, список задач]]
    optional: [[есть, наш, нашем], [мне, нам]]
    exclude: [мой, моем, моих, мои, мою, добавь, удали, убери, вычеркни, отметь, пометь]
    home: todo_list
    action:
