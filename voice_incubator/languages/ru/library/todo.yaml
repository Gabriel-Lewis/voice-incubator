      after: [отметь, отметьте, вычеркни, вычеркните, пометь, пометьте]
      before: [в, из, как сделанное, как сделанные, как выполненное, как выполненные, сделанным, выполненным]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: todo_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: Отмечено.
        specific: "Отмечено в списке дел: {{ slots.item }}."
    needs:
