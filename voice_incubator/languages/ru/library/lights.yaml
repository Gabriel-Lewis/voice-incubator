# Lights and switches (Russian), as the English library's lights.yaml: on and
# off, brightness, color, and asking which are on.
#
# What acts on devices runs Home Assistant's intents (intent:): on a device by
# name, or on those added to the area on the Names page (devices), each by
# name -- and the unavailable said. What is said back of a device by name
# takes no gender it can't know: "Включено: Торшер.".
title: Lights and switches
icon: mdi:lightbulb-outline

# Commands shown together in Add a command: each one's topic.
topics:
  on_and_off: {title: On and off, icon: mdi:lightbulb-on-outline}
  brightness_and_color: {title: Brightness and color, icon: mdi:brightness-6}

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).
  # 30 percent brighter or dimmer (slots.step), never to off: the lights that
  # are on here, or in an area or floor named, of those added there (Names) --
  # no intent changes brightness by a step -- or a light by name, which
  # comes on to be brightened.
  brightness_step: &brightness_step
    - variables:
        none_on: {outcome: no_lights}
        lights: >-
          {%- if slots.entity -%}
          {{ (slots.entity | select('is_state', 'on') | list) if slots.step | int < 0 else slots.entity }}
          {%- else -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for s in states.light if devices.get(s.entity_id) in place.areas and s.state == 'on'
            and s.attributes.supported_color_modes != ['onoff'] -%}
          {%- set ns.ids = ns.ids + [s.entity_id] -%}
          {%- endfor -%}
          {{ ns.ids }}
          {%- endif -%}
    - if: "{{ not lights }}"
      then:
        - stop: No lights to change
          response_variable: none_on
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >-
                {{ [[((state_attr(repeat.item, 'brightness') or 0) / 2.55) | round(0) + slots.step | int, 1] | max, 100] | min | int }}
  brightness_said: &brightness_said
    no_lights: >-
      {{ ('Сейчас не горит: ' ~ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ '.') if slots.entity
      else 'Свет ' ~ place.said ~ ' не горит.' }}

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    topic: on_and_off
    icon: mdi:lightbulb-on-outline
    description: включить свет
    require: [[включи, включите, включить, включай, зажги, зажгите, вруби, врубите],
              [свет, лампу, лампы, лампочку, лампочки, люстру, люстры, светильник, светильники, освещение, подсветку]]
    optional: [[весь, всю, все]]
    exclude: [выключи, выключите, выключить, погаси, погасите, выруби]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Свет включён.
        specific: Свет включён {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Свет включён {{ place.said }}.
          {%- else -%}
          Включено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' и ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: включить устройство
        require: [[включи, включите, включить, включай, вруби, врубите, запусти, запустите]]
        intent: HassTurnOn
        response:
          done:
            brief: Включено.
            specific: "Включено: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Включено {{ place.said }}: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    topic: on_and_off
    icon: mdi:lightbulb-off-outline
    description: выключить свет
    require: [[выключи, выключите, выключить, выключай, погаси, погасите, потуши, потушите, выруби, вырубите],
              [свет, лампу, лампы, лампочку, лампочки, люстру, люстры, светильник, светильники, освещение, подсветку]]
    optional: [[весь, всю, все], [дома, во всем доме, везде]]
    exclude: [включи, включите, включить, зажги]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Свет выключен.
        specific: Свет выключен {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Свет выключен {{ place.said }}.
          {%- else -%}
          Выключено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' и ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: выключить устройство
        require: [[выключи, выключите, выключить, выключай, выруби, вырубите, останови, остановите]]
        intent: HassTurnOff
        response:
          done:
            brief: Выключено.
            specific: "Выключено: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Выключено {{ place.said }}: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    topic: on_and_off
    icon: mdi:lightbulb-question
    description: узнать, где горит свет
    # No example sentences: one said word for word carries no area or floor.
    require: [[горит, горят, включен, включена, включено, включены],
              [свет, лампа, лампы, лампочка, лампочки, люстра, светильник, светильники]]
    optional: [[ли], [еще, сейчас, где]]
    exclude: [включи, включите, выключи, выключите, погаси, зажги]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- set lamps = 'светильник' if count % 10 == 1 and count % 100 != 11 else
        ('светильника' if count % 10 in [2, 3, 4] and (count % 100 < 12 or count % 100 > 14) else 'светильников') -%}
      {%- if count == 0 -%}
      Нет, свет{{ where }} не горит.
      {%- elif count > 3 -%}
      Да,{{ where }} горит {{ count }} {{ lamps }}.
      {%- else -%}
      Да, горит: {{ (ns.on[:-1] | join(', ') ~ ' и ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (set on its page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: узнать, включено ли устройство
        # "Торшер включён?", "включена ли лампа?": the state is the question.
        require: null
        optional: [[ли], [еще, сейчас]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set name = names.get(e, state_attr(e, 'friendly_name')) or e -%}
          {%- set last = (name.split(' ')[0] | lower)[-1:] -%}
          {%- set g = 'f' if last in ['а', 'я'] else ('n' if last in ['о', 'е'] else 'm') -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': {'m': 'включён', 'f': 'включена', 'n': 'включено'},
            'off': {'m': 'выключен', 'f': 'выключена', 'n': 'выключено'},
            'unavailable': {'m': 'недоступен', 'f': 'недоступна', 'n': 'недоступно'}} -%}
          {%- set said = name ~ ' ' ~ (words[state][g] if state in words else 'в неизвестном состоянии') ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Да' if state == slots.asked else 'Нет' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    topic: brightness_and_color
    icon: mdi:brightness-6
    description: изменить яркость света
    supports: brightness
    # To a number, also turned on, brightened or dimmed: "приглуши свет до
    # двадцати процентов", "включи свет на кухне на пятьдесят процентов".
    # Never in kelvin, or in some minutes.
    require: [[яркость, яркости, процентов, процента, процент]]
    optional: [[поставь, установи, сделай, измени, выставь, включи, убавь, прибавь, приглуши, приглушите],
               [свет, лампу, лампы, люстру, светильник, подсветку], [яркость], [до]]
    # A question: "сколько будет 15 процентов от 80"; the music's volume, the
    # heat, the covers.
    exclude: [сколько, какая, какой, чему, будет, от, громкость, громкости, звук, музыку, телевизор, температуру,
              градусов, градуса, термостат, кельвинов, минут, минуты, минуту, часов, часа, секунд, шторы, жалюзи,
              рольставни, окно]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Яркость изменена.
        specific: >-
          {%- set p = slots.percentage | int -%}
          {%- set word = 'процент' if p % 10 == 1 and p % 100 != 11 else
            ('процента' if p % 10 in [2, 3, 4] and (p % 100 < 12 or p % 100 > 14) else 'процентов') -%}
          {%- if slots.entity -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}: яркость {{ p }} {{ word }}.
          {%- else -%}
          Яркость {{ place.said }}: {{ p }} {{ word }}.
          {%- endif -%}
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    topic: brightness_and_color
    icon: mdi:format-color-fill
    description: изменить цвет света
    supports: color
    # "Сделай свет красным", "включи синий свет", "поменяй цвет лампы на зелёный".
    # "Делай": "сделай" as the model often hears it.
    require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи, цвет],
              [свет, лампу, лампы, лампочку, люстру, светильник, подсветку]]
    optional: [[цвет]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Цвет изменён.
        specific: >-
          {%- set colors = {'red': 'красный', 'orange': 'оранжевый', 'yellow': 'жёлтый', 'green': 'зелёный',
            'blue': 'синий', 'purple': 'фиолетовый', 'pink': 'розовый', 'white': 'белый', 'turquoise': 'бирюзовый', 'magenta': 'пурпурный'} -%}
          {%- set c = colors.get(slots.color, slots.color) -%}
          {%- if slots.entity -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}: {{ c }} цвет.
          {%- else -%}
          Свет {{ place.said }} теперь {{ c }}.
          {%- endif -%}
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи, цвет]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  brighter:
    title: Brighter
    topic: brightness_and_color
    icon: mdi:brightness-7
    description: сделать свет ярче
    supports: brightness
    # "Сделай свет ярче", "прибавь яркость", "сделай свет на кухне поярче".
    require: [[ярче, поярче, прибавь, прибавьте, увеличь, увеличьте],
              [свет, лампу, лампы, лампочку, люстру, светильник, подсветку, освещение, яркость]]
    optional: [[сделай, сделайте], [немного, чуть, еще]]
    exclude: [процентов, процента, процент, громкость, звук, музыку, температуру, отопление]
    slots: {step: 30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Ярче.
        specific: >-
          {{ ('Сделано ярче: ' ~ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ '.') if slots.entity
          else 'Свет ' ~ place.said ~ ' стал ярче.' }}
    variants:
      here:
        title: Brighter in this satellite's area
        examples: ["[сделай] [немного|чуть] (ярче|поярче) [здесь|тут]"]
      device:
        <<: *device
        title: Brighten a light by name
        require: [[ярче, поярче, прибавь яркость, прибавьте яркость, увеличь яркость, увеличьте яркость]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may brighten (Names page).
      place:
        <<: *place
        title: Brighter in an area or floor

  dimmer:
    title: Dimmer
    topic: brightness_and_color
    icon: mdi:brightness-4
    description: сделать свет темнее
    supports: brightness
    # "Приглуши свет", "убавь яркость", "сделай свет в спальне потемнее".
    require: [[темнее, потемнее, тусклее, приглуши, приглушите, убавь, убавьте, уменьши, уменьшите],
              [свет, лампу, лампы, лампочку, люстру, светильник, подсветку, освещение, яркость]]
    optional: [[сделай, сделайте], [немного, чуть, еще]]
    exclude: [процентов, процента, процент, громкость, звук, музыку, температуру, отопление]
    slots: {step: -30}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Приглушено.
        specific: >-
          {{ ('Приглушено: ' ~ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) ~ '.') if slots.entity
          else 'Свет ' ~ place.said ~ ' приглушён.' }}
    variants:
      here:
        title: Dimmer in this satellite's area
        examples: ["[сделай] [немного|чуть] (темнее|потемнее|тусклее) [здесь|тут]"]
      device:
        <<: *device
        title: Dim a light by name
        require: [[темнее, потемнее, тусклее, приглуши, приглушите, убавь яркость, убавьте яркость, уменьши яркость,
                   уменьшите яркость]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Dimmer in an area or floor

  light_temperature:
    title: Set the color temperature
    topic: brightness_and_color
    icon: mdi:white-balance-sunny
    description: изменить цветовую температуру света
    supports: color_temp
    # By what the white is called: теплый, мягкий, нейтральный, холодный,
    # дневной (the color_temperatures list, in kelvin): "сделай свет теплым",
    # "включи холодный белый свет".
    require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи],
              [свет, лампу, лампы, лампочку, люстру, светильник, подсветку]]
    optional: [[цветовую температуру, цветовая температура, оттенок, на]]
    lists:
      color_temperature: {list: color_temperatures}
    intent:
      name: HassLightSet
      slots: {temperature: "{{ slots.color_temperature }}"}
    verbosity: beep
    response:
      done:
        brief: Оттенок изменён.
        specific: >-
          {%- set k = slots.color_temperature | default(0) | int -%}
          {%- set word = 'кельвин' if k % 10 == 1 and k % 100 != 11 else
            ('кельвина' if k % 10 in [2, 3, 4] and (k % 100 < 12 or k % 100 > 14) else 'кельвинов') -%}
          {%- if slots.entity -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}: {{ k }} {{ word }}.
          {%- else -%}
          Свет {{ place.said }}: {{ k }} {{ word }}.
          {%- endif -%}
    variants:
      here:
        title: Set the color temperature in this satellite's area
      device:
        <<: *device
        title: Set the color temperature of a light by name
        require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color_temperature], [entity, area, color_temperature]]
        needs:
          - Add names for the lights it may change (Names page).
      place:
        <<: *place
        title: Set the color temperature in an area or floor
        combinations: [[area, color_temperature], [floor, color_temperature]]
