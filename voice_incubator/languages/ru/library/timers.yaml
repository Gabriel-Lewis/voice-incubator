# Timers (Russian), as the English library's timers.yaml: on the satellite
# that set them, with the Voice Incubator integration in Home Assistant. A timer is
# picked out by:
#   timer_name  a running timer's name: "отмени таймер пицца"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "таймер под названием паста", "таймер для пасты"
#               (named "для пасты", as it was said)
#   duration    "таймер на 5 минут"
# or it is the only one running. What they say is the language's (its speech
# module's timer sentences): "Таймер «пицца» запущен".
#
# Timers are the satellite's own, so they have no versions (variants) for a
# device or a place named. Alarms and reminders with a time are events on the
# Voice Incubator calendar in Home Assistant, which the app makes, and ring the
# satellite that set them; when one is for is read by the language's calendar
# module ("на семь тридцать", "по будням в 6:45", "через 20 минут").
title: Timers and alarms
icon: mdi:timer-outline

# Commands shown together in Add a command: each one's topic.
topics:
  timers: {title: Timers, icon: mdi:timer-outline}
  alarms: {title: Alarms, icon: mdi:alarm}

commands:
  start_timer:
    title: Start a timer
    topic: timers
    icon: mdi:timer-plus-outline
    description: поставить таймер
    # "Поставь таймер на 5 минут", "засеки десять минут", "таймер пицца на
    # полчаса", "поставь таймер под названием паста на десять минут".
    require: [[таймер, засеки, засекай, засеките]]
    optional: [[поставь, поставьте, установи, установите, заведи, заведите, включи, запусти, запустите, начни, создай],
               [под названием, с названием],
               [минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час]]
    wildcard: {slot: timer, after: [таймер, под названием, с названием], max_words: 3}
    # Quarters too ("четверть часа", "три четверти часа"), and halves and
    # quarters as likely as whole numbers: "таймер на полчаса" is not one
    # named "полчаса".
    number:
      preset: duration
      min: 0.25
      step: 0.25
      prior:
        - {when: [секунд, секунды, секунду, секунда], multiple_of: 5, cost: 0}
        - {when: [секунд, секунды, секунду, секунда], cost: 2.5}
        - {multiple_of: 0.25, cost: 0}
        - {cost: 1.0}
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    topic: alarms
    icon: mdi:alarm
    description: поставить будильник
    # On the Voice Incubator calendar in Home Assistant: "поставь будильник на
    # семь тридцать", "разбуди меня в шесть утра", "будильник на половину
    # седьмого завтра", "будильник по будням на 6:45", "будильник на завтра на
    # 8", "будильник через 20 минут". Without "утра" or "вечера" it is the next
    # time that comes round; on another day, the morning. Not "буди": heard in
    # "забудь".
    require: [[будильник, разбуди меня, разбудите меня, разбуди нас, разбуди, разбудите]]
    optional: [[поставь, поставьте, установи, установите, заведи, заведите, включи], [на, в, к]]
    wildcard: {slot: time, after: [будильник, разбуди меня, разбудите меня, разбуди нас, разбуди, разбудите, на, в, к],
               to_end: true, max_words: 9}
    exclude: [отмени, отмените, отключи, выключи, удали, убери, сними, сколько, какие, какой, когда, есть ли]
    timer: alarm
    verbosity: specific
    response:
      missing_time: На какое время поставить будильник?

  cancel_alarm:
    title: Cancel an alarm
    topic: alarms
    icon: mdi:alarm-off
    description: отменить будильник
    # "Отмени будильник", "удали будильник на семь", "выключи будильник на
    # завтра", "отмени завтрашний будильник". Said over a ringing alarm
    # without a time, it only stops it.
    require: [[отмени, отмените, удали, удалите, убери, уберите, выключи, выключите, отключи, отключите, сними, снимите,
               останови, остановите], [будильник, будильники, будильника]]
    optional: [[на, в, во]]
    # Right after the verb too: Russian has no article to lead text before
    # "будильник" ("отмени завтрашний будильник").
    wildcard: {slot: time, before: [будильник], after: [отмени, отмените, удали, удалите, убери, уберите, выключи,
               выключите, отключи, отключите, сними, снимите, останови, остановите, будильник, на, в, во], max_words: 6}
    combinations: [[], [time]]
    timer: cancel_alarm
    verbosity: specific

  alarm_status:
    title: Say the alarms
    topic: alarms
    icon: mdi:alarm-check
    description: сказать, какие будильники поставлены
    examples: ["какие [у меня] будильники", "когда [у меня] будильник", "на какое время [стоит|поставлен] будильник",
               "есть ли [у меня] будильники", "у меня есть будильники"]
    require: [[будильник, будильники, будильников, будильника]]
    optional: [[какие, какой, когда, на какое время, на сколько, есть ли, есть], [у меня, у нас],
               [стоит, стоят, поставлен, поставлены, заведен, заведены]]
    exclude: [отмени, отмените, удали, удалите, убери, выключи, отключи, сними, поставь, поставьте, установи, заведи,
              разбуди]
    timer: alarm_status

  cancel_timer:
    title: Cancel a timer
    topic: timers
    icon: mdi:timer-off-outline
    description: отменить таймер
    require: [[отмени, отмените, отменить, останови, остановите, выключи, выключите, удали, удалите, сбрось, сбросьте,
               убери, уберите], [таймер]]
    optional: [[минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    # Not a new one: "поставь таймер для пиццы".
    exclude: [поставь, установи, заведи, засеки, все, всех]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, под названием, с названием], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    topic: timers
    icon: mdi:timer-cancel-outline
    description: отменить все таймеры
    require: [[отмени, отмените, останови, остановите, выключи, выключите, удали, удалите, сбрось, убери], [все],
              [таймеры, таймер, таймера]]
    timer: cancel_all
    verbosity: specific
    # More than one running: asked first (no count: its noun's form follows it).
    confirm: "{{ timers | count > 1 }}"
    response:
      confirm: "Отменить все таймеры?"

  pause_timer:
    title: Pause a timer
    topic: timers
    icon: mdi:timer-pause-outline
    description: поставить таймер на паузу
    require: [[пауза, паузу, поставь на паузу, поставь ... на паузу, приостанови, приостановите], [таймер]]
    optional: [[минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, под названием, с названием], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    topic: timers
    icon: mdi:timer-play-outline
    description: продолжить таймер
    require: [[продолжи, продолжите, возобнови, возобновите, сними с паузы, сними ... с паузы, запусти снова,
               снова запусти], [таймер]]
    optional: [[минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, под названием, с названием], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    topic: timers
    icon: mdi:timer-sand
    description: узнать, сколько осталось на таймере
    examples: ["сколько [времени] осталось", "сколько осталось на таймере", "сколько еще осталось"]
    require: [[сколько, сколько времени], [осталось, остается]]
    optional: [[таймер, таймере, таймера, таймеру], [еще],
               [минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    # A date: "сколько дней осталось до Нового года".
    exclude: [до, дней, дня, недель, недели, месяцев, лет]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, таймере, таймера, таймеру, под названием, с названием], max_words: 3}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    topic: timers
    icon: mdi:clock-plus-outline
    description: добавить время на таймер
    # "Добавь 5 минут к таймеру", "продли таймер пицца на 5 минут".
    require: [[добавь, добавьте, прибавь, прибавьте, продли, продлите, увеличь, увеличьте], [таймер, таймеру, таймера]]
    optional: [[к, ко], [минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, таймеру, таймера, под названием, с названием], max_words: 3}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    topic: timers
    icon: mdi:clock-minus-outline
    description: убавить время на таймере
    # "Убавь 2 минуты на таймере", "сократи таймер пицца на 2 минуты".
    require: [[убавь, убавьте, отними, отнимите, сократи, сократите, уменьши, уменьшите, вычти], [таймер, таймере,
              таймера, таймеру]]
    optional: [[от], [минут, минуты, минуту, минута, секунд, секунды, секунду, секунда, часов, часа, час],
               [под названием, с названием]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, after: [таймер, таймере, таймера, таймеру, под названием, с названием], max_words: 3}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
