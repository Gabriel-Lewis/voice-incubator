# Reminders and calendar (Russian), as the English library's reminders.yaml:
# reminders, and what's on the speaker's calendar. When a reminder is for is
# read by the language's calendar module ("в 5 вечера", "завтра в 9",
# "каждый вторник в 7 вечера", "через 10 минут"), and what it is of is said
# back as it was said, "мой" as "ваш": "Напомню позвонить вашей маме в 17:00."
title: Reminders and calendar
icon: mdi:calendar-clock

# Commands shown together in Add a command: each one's topic.
topics:
  reminders: {title: Reminders, icon: mdi:calendar-clock}

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: сказать, что у меня в календаре на сегодня
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["что у меня в календаре [на сегодня]", "что [у меня] в моем календаре [на сегодня]",
               "какие у меня планы на сегодня", "что у меня [сегодня] по расписанию"]
    require: [[календарь, календаре, календаря, расписание, расписании, расписанию, планы, планов]]
    optional: [[что, какие, есть], [у меня, по], [на сегодня, сегодня]]
    exclude: [добавь, удали, отмени, напомни]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}До конца дня в вашем календаре ничего нет.
        {% elif events | count == 1 %}Сегодня у вас: {{ events[0] }}.
        {% else %}Сегодня у вас: {{ events[:-1] | join(', ') }} и {{ events[-1] }}.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    topic: reminders
    icon: mdi:calendar-clock
    description: добавить напоминание
    # With a time, an event on the Voice Incubator calendar that is said on this
    # satellite then: "напомни в 5 вечера позвонить маме", "напомни выносить
    # мусор каждый вторник в 7 вечера", "напомни через 10 минут проверить
    # духовку", "напомни, что завтра в 9 придёт сантехник". Without one, it
    # goes on the to-do list.
    require: [[напомни, напомните, напомнишь]]
    wildcard:
      slot: reminder
      after: [напомни, напомните, напомнишь]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    topic: reminders
    icon: mdi:calendar-remove
    description: отменить напоминание
    # On the Voice Incubator calendar, by what it is about, when it is, or both:
    # "отмени напоминание позвонить маме", "удали напоминание на завтра",
    # "отмени напоминание в 5 вечера"; with one, the only one.
    require: [[отмени, отмените, удали, удалите, убери, уберите, забудь, забудьте], [напоминание, напоминания]]
    # Right after the verb too: "удали завтрашнее напоминание".
    wildcard: {slot: reminder, after: [отмени, отмените, удали, удалите, убери, уберите, забудь, забудьте, напоминание,
               напоминания], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    topic: reminders
    icon: mdi:calendar-clock
    description: сказать, какие напоминания впереди
    examples: ["какие у меня напоминания", "есть ли у меня напоминания", "какие есть напоминания"]
    require: [[напоминания, напоминание, напоминаний]]
    optional: [[какие, какое, есть ли, есть], [у меня, у нас]]
    exclude: [напомни, напомните, добавь, поставь, отмени, удали, убери, забудь]
    timer: reminder_status
