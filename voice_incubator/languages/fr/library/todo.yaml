# Lists (French), as the English library's todo.yaml: the shopping list and
# the to-do list: adding to them, checking off, taking off, and what's on
# them.
title: Lists
icon: mdi:format-list-checks

# Commands shown together in Add a command: each one's topic.
topics:
  shopping_list: {title: Shopping list, icon: mdi:cart-outline}
  todo_list: {title: To-do list, icon: mdi:format-list-checks}

commands:
  shopping_list_add:
    title: Add to the shopping list
    topic: shopping_list
    icon: mdi:cart-plus
    description: ajouter quelque chose à la liste de courses
    # "mais": mets as a speech-to-text often writes it.
    require: [[ajoute, ajouter, rajoute, mets, mais, note], [liste de courses, liste des courses, liste]]
    optional: [[à, sur, dans]]
    exclude: [tâches, tâche, choses à faire]
    wildcard:
      slot: item
      after: [ajoute, ajouter, rajoute, mets, mais, note]
      before: [à, sur, dans]
      bounded: true
      max_words: 8
    home: shopping_list
    # Each item said ("des oranges et des bananes": two), unless the list has
    # one called that whole ("poivre et sel"); one the list has already isn't
    # added again (already_on_list).
    adds_to_list: {slot: item, list: entity, each: true}
    action:
      # What isn't on the list is added; what was checked off is checked back on.
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ back }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ slots.entity }}"
              data:
                item: "{{ repeat.item }}"
                status: needs_action
    verbosity: specific
    response:
      done:
        brief: Ajouté à la liste de courses.
        specific: "J'ai ajouté {{ slots.item }} à la liste de courses."
        verbose: >-
          {%- if added -%}
          J'ai ajouté {{ added }} à la liste de courses{{ ' et remis ' ~ put_back ~ ' dessus' if put_back }}.
          {%- else -%}
          J'ai remis {{ put_back }} sur la liste de courses.
          {%- endif -%}

  shopping_list_remove:
    title: Take off the shopping list
    topic: shopping_list
    icon: mdi:cart-minus
    description: enlever quelque chose de la liste de courses
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The items said are ones on the list: "test trois" is
    # "test 3"; "les pommes et les bananes" two of them (items), unless one is
    # called that.
    require: [[enlève, enlever, retire, retirer, supprime, efface], [liste de courses, liste des courses, liste]]
    optional: [[de, des, du, sur]]
    exclude: [tâches, tâche, choses à faire]
    wildcard:
      slot: item
      after: [enlève, enlever, retire, retirer, supprime, efface]
      before: [de, des, du, sur]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ items }}"
    verbosity: specific
    response:
      done:
        brief: "{{ 'Enlevé de la liste de courses.' if items | count < 2 else 'Enlevés de la liste de courses.' }}"
        specific: "J'ai enlevé {{ slots.item }} de la liste de courses."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    topic: shopping_list
    icon: mdi:cart-check
    description: cocher quelque chose comme acheté sur la liste de courses
    # Done, and kept on the list as such: "raye le lait de la liste", "coche
    # les œufs sur la liste de courses", "marque le pain comme acheté sur la
    # liste", "coche les pommes et les bananes sur la liste de courses" (each
    # of the items).
    require: [[coche, cocher, raye, rayer, barre, barrer, marque], [liste de courses, liste des courses, liste]]
    optional: [[de, sur, dans], [comme acheté, comme achetés, comme fait]]
    exclude: [tâches, tâche, choses à faire]
    wildcard:
      slot: item
      after: [coche, cocher, raye, rayer, barre, barrer, marque]
      before: [de, sur, dans, comme acheté, comme achetés, comme fait]
      bounded: true
      max_words: 8
    on_list: {item: entity}
    home: shopping_list
    action:
      repeat:
        for_each: "{{ items }}"
        sequence:
          - action: todo.update_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
              status: completed
    verbosity: specific
    response:
      done:
        brief: "{{ 'Coché.' if items | count < 2 else 'Cochés.' }}"
        specific: "J'ai coché {{ slots.item }} sur la liste de courses."
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    topic: shopping_list
    icon: mdi:cart-outline
    description: savoir ce qu'il y a sur la liste de courses
    # What is still to get; what was checked off is left out.
    examples: ["qu'est ce qu'il y a sur (la|ma|notre) liste de courses", "qu'est ce qu'on doit acheter", "lis [moi] la liste de courses"]
    require: [[qu'est ce qu'il y a, qu'y a t il, lis, lire, dis moi, donne moi], [liste de courses, liste des courses]]
    optional: [[sur, dans], [moi]]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        La liste de courses est vide.
        {%- elif count == 1 -%}
        Il y a {{ listed[0] }} sur la liste de courses.
        {%- elif count > 8 -%}
        Il y a {{ count }} choses sur la liste de courses : {{ listed[:5] | join(', ') }} et {{ count - 5 }} autres.
        {%- else -%}
        Sur la liste de courses : {{ listed[:-1] | join(', ') }} et {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list in Settings, or give it one of its
        own (its implied target).

